        function clearPending(conv) {
            conv.currentFiles = [];
            conv.currentImages = [];
            renderPending();
        }

        // 兼容旧版本暂存的图片（currentImages 结构）
        function migrateLegacyImages(conv) {
            if (conv && conv.currentImages && conv.currentImages.length > 0) {
                if (!conv.currentFiles) conv.currentFiles = [];
                conv.currentImages.forEach((src, i) => {
                    conv.currentFiles.push({
                        id: 'legacy' + i + '_' + Date.now(),
                        name: '图片' + (i + 1) + '.png',
                        size: 0,
                        type: 'image/png',
                        dataUrl: src,
                        content: null
                    });
                });
                conv.currentImages = [];
            }
        }

        // 拖拽文件夹到输入框：递归读取目录内全部文件
        function setupInputDrop() {
            const zone = document.querySelector('.input-container');
            if (!zone || zone.dataset.dropBound) return;
            zone.dataset.dropBound = '1';
            zone.addEventListener('dragover', e => { e.preventDefault(); });
            zone.addEventListener('drop', e => {
                e.preventDefault();
                const entries = [];
                if (e.dataTransfer && e.dataTransfer.items) {
                    for (const it of e.dataTransfer.items) {
                        const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
                        if (en) entries.push(en);
                    }
                }
                if (entries.length > 0) {
                    walkEntries(entries, 0).then(files => { if (files.length) addPendingFiles(files); });
                } else if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                    addPendingFiles(Array.from(e.dataTransfer.files));
                }
            });
        }

        function walkEntries(entries, depth) {
            const tasks = entries.map(entry => new Promise(resolve => {
                if (entry.isFile) {
                    entry.file(f => resolve([f]), () => resolve([]));
                } else if (entry.isDirectory && depth < 4) {
                    const reader = entry.createReader();
                    const readAll = acc => new Promise(res => {
                        reader.readEntries(list => {
                            if (!list || list.length === 0) { res(acc); return; }
                            walkEntries(list, depth + 1).then(inner => readAll(acc.concat(inner)).then(res));
                        }, () => res(acc));
                    });
                    readAll([]).then(resolve);
                } else {
                    resolve([]);
                }
            }));
            return Promise.all(tasks).then(arrs => {
                let out = [];
                arrs.forEach(a => { out = out.concat(a); });
                return out.slice(0, 200);
            });
        }

        let toastTimer = null;
        function showToast(msg) {
            let el = document.getElementById('appToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'appToast';
                el.className = 'app-toast';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        function quickAsk(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            // Ensure we have a conversation
            if (!currentConvId || !conversations[currentConvId]) {
                createNewChat();
            }
            
            const conv = getCurrentConversation();
            migrateLegacyImages(conv);
            const pending = conv.currentFiles || [];
            const images = pending.filter(f => f.type && f.type.startsWith('image/') && f.dataUrl);
            const textFiles = pending.filter(f => f.content);
            
            if ((!text && pending.length === 0) || conv.isLoading) return;

            conv.isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            // Build message content（文本文件内容作为上下文注入）
            let sendText = text;
            if (textFiles.length > 0) {
                const fileContext = textFiles.map(f => '【附件文件：' + f.name + '】\n' + f.content).join('\n\n');
                sendText = fileContext + '\n\n' + (text ? '【我的问题】\n' + text : '请帮我分析讲解以上附件文件的内容。');
            }
            let content = [];
            images.forEach(img => {
                content.push({ type: 'image_url', image_url: { url: img.dataUrl } });
            });
            if (sendText) {
                content.push({ type: 'text', text: sendText });
            }

            // Display user message（气泡中只显示问题与附件标记）
            const attachedMeta = pending.map(f => ({ name: f.name, size: f.size }));
            addMessage('user', text, images.map(i => i.dataUrl), true, [], attachedMeta);
            
            // Save to conversation
            conv.messages.push({ role: 'user', content: content, displayText: text, attachedFiles: attachedMeta });
            conv.updatedAt = Date.now();
            saveConversations();
            updateConversationTitle();

            // Clear input
            input.value = '';
            input.style.height = 'auto';
            conv.inputText = '';
            
            // 附件随消息发送后自动存入工作区
            if (pending.length > 0) {
                if (!conv.workspaceFiles) conv.workspaceFiles = [];
                pending.forEach(f => {
                    let dataUrl = f.dataUrl;
                    if (!dataUrl && f.content) {
                        dataUrl = 'data:' + (f.type || 'text/plain') + ';charset=utf-8,' + encodeURIComponent(f.content);
                    }
                    conv.workspaceFiles.push({
                        id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                        name: f.name,
                        size: f.size,
                        type: f.type,
                        dataUrl: dataUrl || null,
                        addedAt: Date.now()
                    });
                });
                showToast(pending.length + ' 个附件已存入工作区');
                if (workspaceOpen) renderWorkspace();
            }
            clearPending(conv);
            saveConversations();

            const typingId = showTyping();
            let searchResults = [];

            try {
                // 如果联网搜索已开启且非费曼模式，先搜索再回答
                const isFeynmanMode = conv.mode === 'feynman' || conv.mode === 'feynman_done';
                if (webSearchEnabled && text && !isFeynmanMode) {
                    const searchStatusId = showSearchStatus('正在联网搜索：' + text);
                    
                    // 给搜索加全局超时（15秒）
                    try {
                        searchResults = await Promise.race([
                            performWebSearch(text),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('搜索超时')), 15000))
                        ]);
                    } catch (searchError) {
                        console.log('搜索超时或失败:', searchError);
                        searchResults = [];
                    }
                    removeSearchStatus(searchStatusId);
                    
                    if (searchResults.length > 0) {
                        const searchContext = formatSearchResultsForAI(searchResults, text);
                        const statusId2 = showSearchStatus(`已找到 ${searchResults.length} 条相关信息，正在整合分析...`);
                        
                        // 记录当前消息数量，方便之后清理临时上下文
                        const msgCountBeforeSearch = conv.messages.length;
                        
                        // 临时注入搜索上下文（仅用于本次API调用）
                        conv.messages.push({ role: 'user', content: '[联网搜索结果]\n' + searchContext });
                        conv.messages.push({ role: 'assistant', content: '好的，我已获取到搜索结果，正在整理答案...' });
                        // 再次加入用户原始消息，让AI基于上下文回答
                        conv.messages.push({ role: 'user', content: content });

                        const searchController = new AbortController();
                        const searchTimeoutId = setTimeout(() => searchController.abort(), 90000);
                        let streamIdleTimer = null;
                        const kickStreamIdle = () => {
                            clearTimeout(streamIdleTimer);
                            streamIdleTimer = setTimeout(() => searchController.abort(), 90000);
                        };

                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${API_KEY}`
                            },
                            body: JSON.stringify({
                                model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                                messages: conv.messages,
                                temperature: 0.7,
                                max_tokens: 2000,
                                stream: true
                            }),
                            signal: searchController.signal
                        });

                        clearTimeout(searchTimeoutId);
                        removeSearchStatus(statusId2);
                        removeTyping(typingId);

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.message || `API 错误：${response.status}`);
                        }

                        // 流式读取搜索结果回复
                        const bubble = createStreamingBubble();
                        let fullReply = '';
                        let streamAborted = false;
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let lastRender = 0;

                        try {
                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                kickStreamIdle();

                                buffer += decoder.decode(value, { stream: true });
                                const lines = buffer.split('\n');
                                buffer = lines.pop();

                                for (const line of lines) {
                                    const trimmed = line.trim();
                                    if (!trimmed || !trimmed.startsWith('data: ')) continue;
                                    const data = trimmed.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const json = JSON.parse(data);
                                        const delta = json.choices?.[0]?.delta?.content;
                                        if (delta) {
                                            fullReply += delta;
                                            const now = Date.now();
                                            if (now - lastRender > 100) {
                                                bubble.innerHTML = formatMessage(fullReply) + '<span class="streaming-cursor">▊</span>';
                                                const container = document.getElementById('chatContainer');
                                                container.scrollTop = container.scrollHeight;
                                                lastRender = now;
                                            }
                                        }
                                    } catch (e) { /* 忽略解析错误 */ }
                                }
                            }
                        } catch (streamErr) {
                            // 超时但已有部分内容：保留已生成部分
                            if (streamErr && streamErr.name === 'AbortError' && fullReply) {
                                streamAborted = true;
                            } else {
                                throw streamErr;
                            }
                        } finally {
                            clearTimeout(streamIdleTimer);
                        }

                        // 最终渲染
                        bubble.innerHTML = formatMessage(fullReply) + (streamAborted ? '<div class="stream-note">⏱️ 回复较长，已在此处中断。发送「继续」可以让我接着讲。</div>' : '');
                        // 添加搜索来源
                        let sourcesHtml = '<div class="search-sources"><details><summary>📋 信息来源（' + searchResults.length + ' 条）</summary>';
                        searchResults.forEach(r => {
                            sourcesHtml += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                        });
                        sourcesHtml += '</details></div>';
                        bubble.innerHTML += sourcesHtml;

                        const chatContainer = document.getElementById('chatContainer');
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        // 清理临时搜索上下文：截断到搜索前的消息数
                        conv.messages.length = msgCountBeforeSearch;
                        // 添加正式的AI回复
                        conv.messages.push({ role: 'assistant', content: fullReply });
                        conv.updatedAt = Date.now();
                        saveConversations();
                    } else {
                        // 搜索无结果，明确告知用户
                        const statusId2 = showSearchStatus('⚠️ 联网搜索未获取到结果，将基于AI自身知识回答（可能不准确）');
                        await new Promise(r => setTimeout(r, 1500));
                        removeSearchStatus(statusId2);
                        
                        // 添加警告消息到对话
                        conv.messages.push({ role: 'assistant', content: '⚠️ 联网搜索未能获取到相关信息（可能是网络问题或服务暂时不可用）。以下回答基于AI自身知识，可能不够准确或时效性不足，仅供参考。' });
                        await callAI(conv, content, typingId, []);
                    }
                } else {
                    // 未开启联网搜索，正常调用AI
                    await callAI(conv, content, typingId, []);
                }

            } catch (error) {
                removeTyping(typingId);
                if (error && error.name === 'AbortError') {
                    addMessage('ai', '⏱️ 请求超时了（网络较慢或服务器繁忙），请再发送一次试试。');
                } else {
                    addMessage('ai', `出错了：${error.message}。请检查网络连接或 API Key。`);
                }
            } finally {
                // 无论如何都要重置状态，防止按钮卡死
                conv.isLoading = false;
                saveConversations();
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        // 创建流式消息气泡（逐字显示）
        function createStreamingBubble() {
            const container = document.getElementById('chatContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = 'message ai';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble"><span class="streaming-cursor">▊</span></div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.querySelector('.bubble');
        }

        // 流式AI调用函数（逐字输出，带空闲超时保护）
        async function callAI(conv, content, typingId, searchResults) {
            const controller = new AbortController();
            // 空闲超时：90秒内没有任何新内容才中断；只要持续输出就不会被截断
            const IDLE_LIMIT = 90000;
            let idleTimer = setTimeout(() => controller.abort(), IDLE_LIMIT);
            const kickIdle = () => {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => controller.abort(), IDLE_LIMIT);
            };
            let bubble = null;
            let fullReply = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                        messages: conv.messages,
                        temperature: 0.7,
                        max_tokens: 2000,
                        stream: true
                    }),
                    signal: controller.signal
                });

                removeTyping(typingId);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `API 错误：${response.status}`);
                }

                // 流式读取响应
                bubble = createStreamingBubble();
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let lastRender = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    kickIdle();

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留未完成的行

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        const data = trimmed.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullReply += delta;
                                // 每100ms更新一次显示，避免过度渲染
                                const now = Date.now();
                                if (now - lastRender > 100) {
                                    bubble.innerHTML = formatMessage(fullReply) + '<span class="streaming-cursor">▊</span>';
                                    const container = document.getElementById('chatContainer');
                                    container.scrollTop = container.scrollHeight;
                                    lastRender = now;
                                }
                            }
                        } catch (e) { /* 忽略解析错误 */ }
                    }
                }

                // 最终渲染（去掉光标）
                bubble.innerHTML = formatMessage(fullReply);
                // 添加搜索来源
                if (searchResults && searchResults.length > 0) {
                    let sourcesHtml = '<div class="search-sources"><details><summary>📋 信息来源（' + searchResults.length + ' 条）</summary>';
                    searchResults.forEach(r => {
                        sourcesHtml += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                    });
                    sourcesHtml += '</details></div>';
                    bubble.innerHTML += sourcesHtml;
                }

                const container = document.getElementById('chatContainer');
                container.scrollTop = container.scrollHeight;

                conv.messages.push({ role: 'assistant', content: fullReply });
                conv.updatedAt = Date.now();
                saveConversations();
            } catch (err) {
                // 超时但已有部分内容：保留已生成的回复，而不是整条报错
                if (err && err.name === 'AbortError' && fullReply) {
                    if (bubble) {
                        bubble.innerHTML = formatMessage(fullReply) + '<div class="stream-note">⏱️ 回复较长，已在此处中断。发送「继续」可以让我接着讲。</div>';
                    }
                    conv.messages.push({ role: 'assistant', content: fullReply });
                    conv.updatedAt = Date.now();
                    saveConversations();
                    return;
                }
                throw err;
            } finally {
                clearTimeout(idleTimer);
            }
        }

        function addMessage(role, text, images, save = true, searchSources = [], attachedFiles = []) {
            const container = document.getElementById('chatContainer');
            
            // Remove empty state if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            let html = '';
            if (images && images.length > 0) {
                images.forEach(img => {
                    html += `<img src="${img}" alt="用户图片">`;
                });
            }
            if (attachedFiles && attachedFiles.length > 0) {
                attachedFiles.forEach(f => {
                    html += `<div class="msg-file-chip">📄 ${escapeHtml(f.name)}</div>`;
                });
            }
            if (text) {
                html += formatMessage(text);
            }
            // 添加搜索来源
            if (searchSources && searchSources.length > 0) {
                html += '<div class="search-sources">';
                html += '<details><summary>📋 信息来源（' + searchSources.length + ' 条）</summary>';
                searchSources.forEach(r => {
                    html += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                });
                html += '</details></div>';
            }
            bubble.innerHTML = html;

            div.appendChild(avatar);
            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function formatMessage(text) {
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/^\* (.+)$/gm, '<li>$1</li>');
            text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
            text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            text = text.replace(/\n\n/g, '</p><p>');
            text = '<p>' + text + '</p>';
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/<p><\/p>/g, '');
            text = text.replace(/<p>(<h3>)/g, '$1');
            text = text.replace(/(<\/h3>)<\/p>/g, '$1');
            text = text.replace(/<p>(<ul>)/g, '$1');
            text = text.replace(/(<\/ul>)<\/p>/g, '$1');
            text = text.replace(/<p>(<pre>)/g, '$1');
            text = text.replace(/(<\/pre>)<\/p>/g, '$1');
            return text;
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            // Save input text to current conversation
            const conv = getCurrentConversation();

        // ===== 工作区面板 =====

        let workspaceOpen = false;

        function toggleWorkspace() {
            workspaceOpen = !workspaceOpen;
            const panel = document.getElementById('workspacePanel');
            const toggle = document.getElementById('workspaceToggle');
            panel.classList.toggle('collapsed', !workspaceOpen);
            toggle.classList.toggle('active', workspaceOpen);
            if (workspaceOpen) renderWorkspace();
        }

        function getWorkspaceFiles() {
            const conv = getCurrentConversation();
            if (!conv) return [];
            if (!conv.workspaceFiles) conv.workspaceFiles = [];
            return conv.workspaceFiles;
        }

        function handleWorkspaceUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            event.target.value = '';
            Array.from(files).forEach(file => pushWorkspaceFile(file, false));
        }

        // 将文件存入当前对话工作区；metaOnly=true 时只存元信息不存内容
        function pushWorkspaceFile(file, metaOnly) {
            const conv = getCurrentConversation();
            if (!conv) return;
            if (!conv.workspaceFiles) conv.workspaceFiles = [];
            const genId = () => Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const canStore = !metaOnly && ((file.type && file.type.startsWith('image/') && file.size < 5 * 1024 * 1024) || file.size < 2 * 1024 * 1024);
            if (canStore) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    conv.workspaceFiles.push({
                        id: genId(),
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        dataUrl: e.target.result,
                        addedAt: Date.now()
                    });
                    saveConversations();
                    renderWorkspace();
                };
                reader.readAsDataURL(file);
            } else {
                // 大文件只存信息不存内容
                conv.workspaceFiles.push({
                    id: genId(),
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    dataUrl: null,
                    addedAt: Date.now()
                });
                saveConversations();
                renderWorkspace();
            }
        }

        function removeWorkspaceItem(id) {
            const conv = getCurrentConversation();
            if (!conv || !conv.workspaceFiles) return;
            conv.workspaceFiles = conv.workspaceFiles.filter(f => f.id !== id);
            saveConversations();
            renderWorkspace();
        }

        function renderWorkspace() {
            const container = document.getElementById('workspaceItems');
            const files = getWorkspaceFiles();

            if (files.length === 0) {
                container.innerHTML = '<div class="workspace-empty"><div class="empty-icon">📁</div>还没有文件<br>上传图片或文档到工作区<br>对话时可随时引用</div>';
                return;
            }

            const images = files.filter(f => f.type && f.type.startsWith('image/'));
            const others = files.filter(f => !f.type || !f.type.startsWith('image/'));

            let html = '';

            if (images.length > 0) {
                html += '<div class="workspace-section-title">图片 (' + images.length + ')</div>';
                html += '<div class="workspace-grid">';
                images.forEach(img => {
                    html += `<div class="workspace-item" onclick="openLightbox('${img.dataUrl || ''}')">
                        <img src="${img.dataUrl || ''}" alt="${escapeHtml(img.name)}">
                        <div class="item-name">${escapeHtml(img.name)}</div>
                        <button class="item-remove" onclick="event.stopPropagation();removeWorkspaceItem('${img.id}')">×</button>
                    </div>`;
                });
                html += '</div>';
            }

            if (others.length > 0) {
                html += '<div class="workspace-section-title">文件 (' + others.length + ')</div>';
                others.forEach(file => {
                    const icon = getFileIcon(file.type, file.name);
                    const size = formatFileSize(file.size);
                    html += `<div class="workspace-file-item">
                        <span class="file-icon">${icon}</span>
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            <div class="file-size">${size}</div>
                        </div>
                        <button class="file-remove" onclick="removeWorkspaceItem('${file.id}')">×</button>
                    </div>`;
                });
            }

            container.innerHTML = html;
        }

        function getFileIcon(type, name) {
            if (!type) type = '';
            if (type.includes('pdf') || name.endsWith('.pdf')) return '📕';
            if (type.includes('word') || name.match(/\.docx?$/)) return '📘';
            if (type.includes('excel') || name.match(/\.xlsx?$/)) return '📗';
            if (type.includes('powerpoint') || name.match(/\.pptx?$/)) return '📙';
            if (type.includes('text') || name.match(/\.(txt|md)$/)) return '📄';
            if (type.includes('zip') || type.includes('rar')) return '📦';
            return '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function openLightbox(src) {
            if (!src) return;
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightboxImg').src = '';
        }

        // 拖拽上传支持
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('workspaceDrop');
            const panel = document.getElementById('workspacePanel');

            ['dragenter', 'dragover'].forEach(evt => {
                panel.addEventListener(evt, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach(evt => {
                panel.addEventListener(evt, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                });
            });
            panel.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    // 复用上传逻辑
                    const input = document.getElementById('workspaceFileInput');
                    input.files = files;
                    handleWorkspaceUpload({ target: input });
                }
            });
        });

        // ===== Share Conversation =====

        function shareConversation() {
            const conv = getCurrentConversation();
            if (!conv) return;
            
            const chatMessages = conv.messages.filter(m => m.role !== 'system');
            if (chatMessages.length === 0) {
                alert('还没有对话内容，先聊点什么再分享吧');
                return;
            }

            // 精简消息结构，减少数据量
            const slim = chatMessages.map(m => {
                if (typeof m.content === 'string') return { r: m.role[0], c: m.content };
                // 多模态消息（含图片）只保留文本部分
                const textParts = m.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
                const item = { r: m.role[0], c: textParts || '' };
                if (m.displayText !== undefined) item.d = m.displayText;
                if (m.attachedFiles && m.attachedFiles.length > 0) item.f = m.attachedFiles.map(f => f.name);
                return item;
            });

            const json = JSON.stringify(slim);
            // 使用 LZ-String 压缩（比纯 base64 短 50-70%）
            const encoded = (typeof LZString !== 'undefined')
                ? LZString.compressToEncodedURIComponent(json)
                : btoa(unescape(encodeURIComponent(json)));
            const url = window.location.origin + window.location.pathname + '#share=' + encoded;

            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.header-btn');
                const original = btn.textContent;
                btn.textContent = '已复制!';
                btn.style.background = '#dcfce7';
                btn.style.color = '#16a34a';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(() => {
                prompt('复制以下链接分享：', url);
            });
        }

        function loadSharedConversation() {
            const hash = window.location.hash;
            if (!hash.startsWith('#share=')) return false;

            const encoded = hash.substring(7);
            try {
                let json;
                // 尝试 LZ-String 解压（新格式）
                if (typeof LZString !== 'undefined') {
                    json = LZString.decompressFromEncodedURIComponent(encoded);
                }
                // 回退到 base64（旧格式兼容）
                if (!json) {
                    json = decodeURIComponent(escape(atob(encoded)));
                }

                const data = JSON.parse(json);
                if (!Array.isArray(data) || data.length === 0) return false;

                // 支持新精简格式 {r:'u',c:'...'} 和旧完整格式 {role:'user',content:'...'}
                const chatMessages = data.map(m => {
                    if (m.r) {
                        const roleMap = { u: 'user', a: 'assistant', s: 'system' };
                        const msg = { role: roleMap[m.r] || m.r, content: m.c };
                        if (m.d !== undefined) msg.displayText = m.d;
                        if (m.f && m.f.length > 0) msg.attachedFiles = m.f.map(name => ({ name: name }));
                        return msg;
                    }
                    return m;
                });

                // Create a new conversation for the shared content
                const id = generateId();
                conversations[id] = createConversationData(id, '分享的对话');
                conversations[id].messages = [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages];
                saveConversations();
                switchToConversation(id);
                renderConversationList();
                
                // Add notice
                const container = document.getElementById('chatContainer');
                const notice = document.createElement('div');
                notice.style.cssText = 'text-align:center;padding:8px;color:#6b7280;font-size:0.85rem;';
                notice.textContent = '— 以上是分享的对话内容，你可以继续提问 —';
                container.appendChild(notice);
                container.scrollTop = container.scrollHeight;

                return true;
            } catch (e) {
                console.error('加载分享对话失败:', e);
                return false;
            }
        }

        // ===== Initialization =====

        function init() {
            loadConversations();
            
            // Check for shared conversation in URL
            const hasShared = loadSharedConversation();
            
            if (!hasShared) {
                // Load existing or create new conversation
                const convIds = Object.keys(conversations);
                if (convIds.length > 0) {
                    const sorted = Object.values(conversations).sort((a, b) => b.updatedAt - a.updatedAt);
                    switchToConversation(sorted[0].id);
                } else {
                    createNewChat();
                }
            }
            
            renderConversationList();
            updateFeynmanUI();
            setupInputDrop();
        }

        init();
    </script>
</body>
