        // ============  AI 单次请求 / 模态框 / 思维导图 / 笔记 / 测验  ============
        async function fetchAIReply(userPrompt, systemPrompt, maxTokens) {
            const msgs = [];
            if (systemPrompt) msgs.push({ role: 'system', content: systemPrompt });
            msgs.push({ role: 'user', content: userPrompt });
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 90000);
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
                    body: JSON.stringify({
                        model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                        messages: msgs,
                        stream: false,
                        max_tokens: maxTokens || 1500,
                        temperature: 0.7
                    }),
                    signal: controller.signal
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const content = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
                if (!content) throw new Error('空回复');
                return content;
            } finally {
                clearTimeout(timer);
            }
        }

        function collectContext(maxChars) {
            const conv = getCurrentConversation();
            if (!conv) return '';
            const msgs = (conv.messages || []).filter(m => m.role !== 'system');
            const lines = [];
            msgs.forEach(m => {
                let text = '';
                if (Array.isArray(m.content)) {
                    text = m.displayText !== undefined ? m.displayText : ((m.content.find(c => c.type === 'text') || {}).text || '');
                } else {
                    text = m.displayText !== undefined ? m.displayText : m.content;
                }
                if (!text) return;
                lines.push((m.role === 'user' ? '用户：' : '助手：') + text);
            });
            let all = lines.join('\n\n');
            if (all.length > maxChars) all = all.slice(-maxChars);
            return all;
        }

        // ===== 思维导图 =====
        async function openMindmap() {
            const ctx = collectContext(6000);
            if (!ctx) { showToast('还没有对话内容，先聊几句吧'); return; }
            showModal('🗺 思维导图', modalLoading('正在梳理知识结构…'));
            try {
                const raw = await fetchAIReply(
                    '请把下面这段学习对话里的知识点整理成层级大纲（思维导图结构）。要求：每行一个节点；用行首空格表示层级，每层缩进2个空格；最多4层；节点总数不超过24个；节点文字简洁（20字以内）；只输出大纲本身，不要任何解释或代码块。\n\n对话内容：\n' + ctx,
                    null, 1200);
                renderMindmap(raw);
            } catch (e) {
                showModal('🗺 思维导图', modalErrorHtml(e && e.name === 'AbortError' ? '请求超时' : '网络或服务异常', 'openMindmap'));
            }
        }
        function parseMindmap(raw) {
            const lines = raw.split('\n').map(l => l.replace(/\t/g, '  ')).filter(l => l.trim());
            const root = { label: '知识地图', children: [] };
            const stack = [{ depth: -1, node: root }];
            lines.forEach(line => {
                const m = line.match(/^(\s*)[-*•]?\s*(.*)$/);
                if (!m) return;
                const depth = Math.floor(m[1].length / 2);
                const label = m[2].trim();
                if (!label) return;
                while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
                const node = { label: label, children: [] };
                stack[stack.length - 1].node.children.push(node);
                stack.push({ depth: depth, node: node });
            });
            return root;
        }
        function renderMindmap(raw) {
            const root = parseMindmap(raw);
            if (!root.children.length) {
                showModal('🗺 思维导图', modalErrorHtml('未能解析出结构', 'openMindmap'));
                return;
            }
            const build = (node) => {
                let html = '<li class="mm-node"><div class="mm-row">';
                if (node.children.length) html += '<button class="mm-caret" data-mm-toggle>▼</button>';
                else html += '<span class="mm-caret">·</span>';
                html += '<span class="mm-label">' + escapeHtml(node.label) + '</span>';
                html += '<button class="mm-ask" data-mm-ask="' + escapeHtml(node.label) + '">追问</button>';
                html += '</div>';
                if (node.children.length) html += '<ul>' + node.children.map(build).join('') + '</ul>';
                html += '</li>';
                return html;
            };
            const body = '<div class="modal-toolbar"><button class="quick-btn" onclick="openMindmap()">🔄 重新生成</button>' +
                '<span style="font-size:0.75rem;color:var(--text-secondary)">点击 ▼ 展开/折叠节点，悬停节点可「追问」</span></div>' +
                '<div class="mm-tree"><ul>' + root.children.map(build).join('') + '</ul></div>';
            showModal('🗺 思维导图', body);
        }

        // ===== 自测出题 + 错题本 =====
        const WRONG_KEY = 'learning_assistant_wrongbook';
        function loadWrong() {
            try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '[]'); } catch (e) { return []; }
        }
        function saveWrong(list) {

        async function openQuiz() {
            const ctx = collectContext(6000);
            if (!ctx) { showToast('还没有对话内容，先聊几句吧'); return; }
            showModal('✍️ 自测出题', quizTabsHtml('quiz') + modalLoading('正在根据对话出题…'));
            try {
                const raw = await fetchAIReply(
                    '根据下面这段学习对话出 4 道单选题，检验我是否真的掌握。严格只按以下格式逐题输出，不要输出任何其他内容：\n题1. 题干\nA. 选项内容\nB. 选项内容\nC. 选项内容\nD. 选项内容\n答案: B\n解析: 解析内容\n\n对话内容：\n' + ctx,
                    null, 2000);
                const qs = parseQuiz(raw);
                if (!qs.length) {
                    showModal('✍️ 自测出题', quizTabsHtml('quiz') + modalErrorHtml('题目格式解析失败', 'openQuiz'));
                    return;
                }
                window._quizData = qs;
                renderQuiz(qs);
            } catch (e) {
                showModal('✍️ 自测出题', quizTabsHtml('quiz') + modalErrorHtml(e && e.name === 'AbortError' ? '请求超时' : '网络或服务异常', 'openQuiz'));
            }
        }
        function parseQuiz(raw) {
            const qs = [];
            const re = /题\s*(\d+)\s*[.、,，:：]?\s*([\s\S]*?)(?=题\s*\d+\s*[.、,，:：]|$)/g;
            let m;
            while ((m = re.exec(raw)) !== null) {
                const block = m[2];
                const opts = [];
                const optRe = /^([A-D])\s*[.、,，:：]\s*(.+)$/gm;
                let om;
                while ((om = optRe.exec(block)) !== null) opts.push({ key: om[1], text: om[2].trim() });
                if (opts.length < 2) continue;
                const firstOptIdx = block.search(/^[A-D]\s*[.、,，:：]/m);
                let title = (firstOptIdx >= 0 ? block.slice(0, firstOptIdx) : block).trim();
                title = title.replace(/^(单选|单选题|多选)\s*[)）]?\s*/, '').trim();
                const ansM = block.match(/答案\s*[:：]\s*([A-D])/);
                const expM = block.match(/解析\s*[:：]\s*([\s\S]*)$/);
                qs.push({ title: title, opts: opts, answer: ansM ? ansM[1] : '', explain: expM ? expM[1].trim() : '' });
            }
            return qs;
        }
        function quizTabsHtml(active) {
            const n = loadWrong().length;
            return '<div class="quiz-tabs">' +
                '<button class="quiz-tab ' + (active === 'quiz' ? 'active' : '') + '" onclick="showQuizTab()">本次测验</button>' +
                '<button class="quiz-tab ' + (active === 'wrong' ? 'active' : '') + '" onclick="showWrongTab()">错题本 (<span data-wrong-count>' + n + '</span>)</button>' +
                '</div>';
        }
        function renderQuiz(qs) {
            let html = quizTabsHtml('quiz');
            html += '<div class="quiz-score">共 ' + qs.length + ' 题，作答后点击提交</div>';
            qs.forEach((q, i) => {
                html += '<div class="quiz-q"><div class="quiz-q-title">' + (i + 1) + '. ' + escapeHtml(q.title) + '</div>';
                q.opts.forEach(o => {
                    html += '<label class="quiz-opt"><input type="radio" name="quiz_q_' + i + '" value="' + o.key + '"><span>' + o.key + '. ' + escapeHtml(o.text) + '</span></label>';
                });
                html += '<div class="quiz-explain"></div></div>';
            });
            html += '<div style="text-align:center"><button class="quick-btn" data-quiz-submit style="padding:8px 24px;font-size:0.9rem">✅ 提交答案</button></div>';
            showModal('✍️ 自测出题', html);
        }
        function showQuizTab() {
            if (window._quizData && window._quizData.length) renderQuiz(window._quizData);
            else openQuiz();
        }
        function showWrongTab() {
            const list = loadWrong();
            let html = quizTabsHtml('wrong');
            if (!list.length) {
                html += '<div class="modal-loading">错题本还是空的<br>测验做错的题会自动收进来</div>';
            } else {
                html += '<div class="modal-toolbar" style="justify-content:flex-end"><button class="quick-btn" data-wrong-clear>🗑 清空错题本</button></div>';
                list.slice().reverse().forEach(w => {
                    html += '<div class="wrong-item"><div class="wrong-q">' + escapeHtml(w.title) + '</div>' +
                        '<div class="wrong-meta">你的答案：' + escapeHtml(w.userAnswer) + '　正确答案：' + escapeHtml(w.answer) +
                        (w.convTitle ? '　来自：' + escapeHtml(w.convTitle) : '') + '　' + new Date(w.addedAt).toLocaleDateString('zh-CN') + '</div>' +
                        '<div class="wrong-actions"><button class="quick-btn" data-wrong-reask="' + w.id + '">💡 再讲一遍</button>' +
                        '<button class="quick-btn" data-wrong-del="' + w.id + '">删除</button></div></div>';
                });
            }
            showModal('✍️ 自测出题', html);
        }
        function gradeQuiz() {
            const qs = window._quizData || [];
            const body = document.getElementById('modalBody');
            let correct = 0;
            const wrongList = loadWrong();
            const conv = getCurrentConversation();
            body.querySelectorAll('.quiz-q').forEach((qEl, i) => {
                const q = qs[i];
                if (!q) return;
                const checked = qEl.querySelector('input:checked');
                const userAns = checked ? checked.value : '';
                const isRight = userAns === q.answer;
                if (isRight) correct++;
                qEl.classList.add('graded');
                qEl.querySelectorAll('.quiz-opt').forEach(opt => {
                    const input = opt.querySelector('input');
                    input.disabled = true;
                    if (input.value === q.answer) opt.classList.add('correct');
                    else if (input.checked) opt.classList.add('wrong');
                });
                const exp = qEl.querySelector('.quiz-explain');
                exp.textContent = '正确答案：' + q.answer + '　你的答案：' + (userAns || '未作答') + (isRight ? '　✅' : '　❌') + '\n' + q.explain;
                if (!isRight) {
                    wrongList.push({
                        id: Date.now() + '_' + i,
                        title: q.title,
                        opts: q.opts,
                        answer: q.answer,
                        explain: q.explain,
                        userAnswer: userAns || '未作答',
                        convTitle: conv ? (conv.title || '') : '',
                        addedAt: Date.now()
                    });
                }
            });
            saveWrong(wrongList);
            const scoreEl = body.querySelector('.quiz-score');
            if (scoreEl) scoreEl.textContent = '得分：' + correct + ' / ' + qs.length + (correct === qs.length ? '　全对，太棒了！' : '　错题已加入错题本');
            const submitBtn = body.querySelector('[data-quiz-submit]');
            if (submitBtn) submitBtn.outerHTML = '<button class="quick-btn" style="padding:8px 24px;font-size:0.9rem" onclick="openQuiz()">🔄 再出一套</button>';
            const wc = body.querySelector('[data-wrong-count]');
            if (wc) wc.textContent = loadWrong().length;
        }

        // 模态框内事件委托
        function setupModalActions() {
            document.getElementById('modalBody').addEventListener('click', (e) => {
                const t = e.target;
                const mmToggle = t.closest('[data-mm-toggle]');
                if (mmToggle) {
                    const li = mmToggle.closest('.mm-node');
                    li.classList.toggle('collapsed');
                    mmToggle.textContent = li.classList.contains('collapsed') ? '▶' : '▼';
                    return;
                }
                const mmAsk = t.closest('[data-mm-ask]');
                if (mmAsk) {
                    const q = '请详细讲解这个知识点：' + mmAsk.getAttribute('data-mm-ask');
                    closeModal();
                    sendRawQuestion(q);
                    return;
                }
                if (t.closest('[data-notes-copy]')) {
                    if (window._lastNotes) copyToClipboard(window._lastNotes, '笔记已复制');
                    return;
                }
                if (t.closest('[data-notes-export]')) {
                    if (window._lastNotes) {
                        const d = new Date();
                        const pad = n => String(n).padStart(2, '0');
                        downloadText('学习笔记-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.md',
                            window._lastNotes, 'text/markdown;charset=utf-8');
                        showToast('笔记已导出');
                    }
                    return;
                }
                if (t.closest('[data-quiz-submit]')) { gradeQuiz(); return; }
                const wrongDel = t.closest('[data-wrong-del]');
                if (wrongDel) {
                    const id = wrongDel.getAttribute('data-wrong-del');
                    saveWrong(loadWrong().filter(w => String(w.id) !== id));
                    showWrongTab();
                    return;
                }
                if (t.closest('[data-wrong-clear]')) {
                    if (!confirm('确定清空错题本吗？')) return;
                    saveWrong([]);
                    showWrongTab();
                    return;
                }
                const reask = t.closest('[data-wrong-reask]');
                if (reask) {
                    const id = reask.getAttribute('data-wrong-reask');
                    const item = loadWrong().find(w => String(w.id) === id);
                    if (!item) return;
                    closeModal();
                    sendRawQuestion('请重新讲解这道题，并说明为什么答案是 ' + item.answer + '：\n' + item.title + '\n' + item.opts.map(o => o.key + '. ' + o.text).join('\n'));
                    return;
                }
            });
        }

        // ============ 个性化主题 ============
        function applyTheme(name) {
            if (name === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', name);
            }
            try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
            document.querySelectorAll('[data-theme-choice]').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-theme-choice') === name);
            });
            const menu = document.getElementById('themeMenu');
            if (menu) menu.classList.remove('open');
        }

        function toggleThemeMenu(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('themeMenu');
            if (menu) menu.classList.toggle('open');
        }

        function initTheme() {
            let saved = 'default';
            try { saved = localStorage.getItem(THEME_KEY) || 'default'; } catch (e) {}
            applyTheme(saved);
            document.addEventListener('click', (e) => {
                const wrap = document.querySelector('.theme-wrap');
                const menu = document.getElementById('themeMenu');
                if (menu && wrap && !wrap.contains(e.target)) menu.classList.remove('open');
            });
        }

        function init() {
            loadConversations();
            
            // Check for shared conversation in URL
            const hasShared = loadSharedConversation();
            
            if (!hasShared) {
                // Load existing or create new conversation
                const convIds = Object.keys(conversations);
                if (convIds.length > 0) {
                    const sorted = Object.values(conversations).sort((a, b) => b.updatedAt - a.updatedAt);
                    switchToConversation(sorted[0].id);
                } else {
                    createNewChat();
                }
            }
            
            renderConversationList();
            updateFeynmanUI();
            setupInputDrop();
            setupQuoteFloat();
            setupModalActions();
            initTheme();
        }

        init();
    </script>
</body>
