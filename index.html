    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script>
        const API_KEY = 'sk-ybhpobmfwuktarckyoggpwsiultahfpxffjjekciuynujjtx';
        const API_URL = 'https://api.siliconflow.cn/v1/chat/completions';
        const STORAGE_KEY = 'learning_assistant_conversations';

        const SYSTEM_PROMPT = `你是一个通用的学习助手，帮助学生理解各种学科知识。

回答要求：
- 用通俗易懂的中文解释，适合学生理解
- 公式用 Unicode 字符表示（如 π, Σ, ），不要用 LaTeX
- 代码用代码块格式
- 分步骤讲解，逻辑清晰
- 如果问题模糊，主动询问具体需求
- 鼓励式教学，耐心细致
- 如果用户发送了图片，仔细分析图片内容并回答相关问题
- 不确定的内容直接说"我不太确定"或"这个我不太了解"，不要编造虚假信息
- 回答要简洁，不要重复相同的内容
- 如果提供了搜索结果，优先基于搜索结果回答，并在回答末尾标注信息来源`;

        const FEYNMAN_PROMPT = `你现在扮演一个好奇、爱追问的同学。学生将给你讲解一个知识点，你的任务是通过提问来检验他是否真正理解。

你的行为规则：
1. 先让学生选择要讲解的主题，然后认真"听讲"
2. 在学生讲解过程中，你要：
   - 对模糊的地方追问"为什么？""能再具体说说吗？"
   - 对可能的逻辑漏洞提出质疑"可是如果...的话，不就矛盾了吗？"
   - 用反例或边界情况测试理解深度"那如果条件变成...，还成立吗？"
   - 偶尔表示"没听懂"，让学生换一种方式解释
3. 不要直接给出正确答案，引导学生自己发现问题
4. 语气友善但刨根问底，像一个真正想搞明白的同学
5. 每次回复控制在2-4句话，不要长篇大论
6. 当学生说"结束"或点击结束评估时，给出最终评价

最终评价格式（当收到[请给出最终评估]指令时）：
📊 费曼学习评估报告

🎯 讲解主题：[主题名]

📈 理解度评分：[X]/10

✅ 掌握良好的部分：
- [列出学生讲解清晰、准确的要点]

⚠️ 需要加强的部分：
- [列出学生含糊、出错或无法深入解释的地方]

💡 学习建议：
- [给出1-3条具体的改进建议]

🏆 总评：[一句话总结]`;

        // ===== 费曼学习法模式 =====

        function startFeynmanMode() {
            const id = generateId();
            const conv = createConversationData(id, '🎓 费曼学习');
            conv.mode = 'feynman';
            conv.messages = [{ role: 'system', content: FEYNMAN_PROMPT }];
            conversations[id] = conv;
            saveConversations();
            switchToConversation(id);
            renderConversationList();
            updateFeynmanUI();

            // AI 先开口引导
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="feynman-intro">
                    <h3>🎓 费曼学习法</h3>
                    <p>用最简单的话把知识讲给别人听，是检验你是否真正掌握的最好方法。</p>
                    <p style="margin-top:8px;color:#78350f;"><strong>规则：</strong>你来当老师，我来当好奇的同学。我会不断追问，直到你能把问题讲得连"小白"都听懂为止。</p>
                </div>
            `;
            // AI 发出第一条引导消息
            const greeting = '你好呀！听说你要给我讲一个新知识点？我超好奇的！你想讲什么主题呢？随便什么都行，数学、物理、历史、编程... come on！';
            conv.messages.push({ role: 'assistant', content: greeting });
            saveConversations();
            addMessage('ai', greeting, [], false);
        }

        function endFeynmanSession() {
            const conv = getCurrentConversation();
            if (!conv || conv.mode !== 'feynman') return;

            // 发送评估指令
            const evalMsg = '[请给出最终评估]';
            conv.messages.push({ role: 'user', content: evalMsg });
            saveConversations();

            const typingId = showTyping();
            document.getElementById('sendBtn').disabled = true;
            conv.isLoading = true;

            // 调用AI获取评估
            callAI(conv, evalMsg, typingId, []).then(() => {
                conv.isLoading = false;
                conv.mode = 'feynman_done';
                saveConversations();
                document.getElementById('sendBtn').disabled = false;
                updateFeynmanUI();
            }).catch(err => {
                conv.isLoading = false;
                saveConversations();
                document.getElementById('sendBtn').disabled = false;
                removeTyping(typingId);
                addMessage('ai', '评估生成失败：' + err.message);
            });
        }

        function updateFeynmanUI() {
            const conv = getCurrentConversation();
            const isFeynman = conv && conv.mode === 'feynman';
            const isDone = conv && conv.mode === 'feynman_done';

            document.getElementById('feynmanBadge').classList.toggle('visible', isFeynman || isDone);
            document.getElementById('feynmanEndBtn').classList.toggle('visible', isFeynman);

            if (isDone) {
                document.getElementById('feynmanBadge').textContent = '🎓 评估已完成';
            } else {
                document.getElementById('feynmanBadge').textContent = '🎓 费曼模式';
            }

            // 更新输入框提示
            const input = document.getElementById('userInput');
            if (isFeynman) {
                input.placeholder = '像给同学讲课一样，把知识点讲给我听...';
            } else if (isDone) {
                input.placeholder = '评估已完成，可以继续提问或新建对话...';
            } else {
                input.placeholder = '输入你的问题，或粘贴图片...';
            }
        }

        // ===== Web Search =====

        let webSearchEnabled = false;

        function toggleWebSearch() {
            webSearchEnabled = !webSearchEnabled;
            const btn = document.getElementById('searchToggle');
            if (webSearchEnabled) {
                btn.classList.add('active');
                btn.textContent = ' 联网已开启';
            } else {
                btn.classList.remove('active');
                btn.textContent = ' 联网搜索';
            }
        }

        // ===== 语音输入（移动端用原生录音，桌面端用 MediaRecorder） =====

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordTimer = null;
        let recordSeconds = 0;

        // 检测是否为移动设备
        function isMobile() {
            return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || 'ontouchstart' in window;
        }

        function toggleVoiceInput() {
            if (isRecording) {
                stopVoiceInput();
                return;
            }

            if (isMobile()) {
                // 移动端：调起原生录音器（兼容微信/QQ/UC/Chrome/Safari）
                document.getElementById('audioInput').click();
            } else {
                // 桌面端：使用 MediaRecorder
                startDesktopRecording();
            }
        }

        // 移动端：处理原生录音文件
        async function handleAudioFile(event) {
            const file = event.target.files[0];
            event.target.value = ''; // 重置，允许重复选择
            
            if (!file) return;

            const overlay = document.getElementById('voiceOverlay');
            overlay.classList.add('active');
            overlay.querySelector('.voice-text').textContent = '⏳ 识别中...';
            overlay.querySelector('.voice-hint').textContent = `正在识别 "${file.name}" (${(file.size/1024).toFixed(0)}KB)`;

            await transcribeAudio(file);
        }

        // 桌面端：MediaRecorder 录音
        async function startDesktopRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
                alert('你的浏览器不支持录音功能。\n\n替代方案：点击输入框，使用键盘自带的语音输入。');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                
                let mimeType = '';
                const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
                for (const type of types) {
                    try {
                        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
                            mimeType = type;
                            break;
                        }
                    } catch (e) {}
                }

                mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                audioChunks = [];
                recordSeconds = 0;

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(recordTimer);
                    
                    if (audioChunks.length === 0) {
                        showVoiceResult('❌ 未录到音频', '请重试');
                        hideOverlayLater();
                        return;
                    }

                    const finalType = mimeType || mediaRecorder.mimeType || 'audio/webm';
                    const blob = new Blob(audioChunks, { type: finalType });
                    
                    if (blob.size < 500) {
                        showVoiceResult('❌ 录音太短', '请至少说1秒以上');
                        hideOverlayLater();
                        return;
                    }

                    await transcribeAudio(blob);
                };

                mediaRecorder.start(250);
                isRecording = true;

                document.getElementById('voiceBtn').classList.add('recording');
                document.getElementById('voiceBtn').textContent = '⏹ 停止';
                const overlay = document.getElementById('voiceOverlay');
                overlay.classList.add('active');
                overlay.querySelector('.voice-text').textContent = '🎤 正在听...';
                overlay.querySelector('.voice-hint').textContent = '说完后点击此处停止（最长60秒）';

                const stopHandler = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    stopVoiceInput();
                };
                overlay.addEventListener('click', stopHandler, { once: true });

                recordTimer = setInterval(() => {
                    recordSeconds++;
                    overlay.querySelector('.voice-text').textContent = `🎤 正在听... (${recordSeconds}s)`;
                    if (recordSeconds >= 60) stopVoiceInput();
                }, 1000);

            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    alert('麦克风权限被拒绝，请在浏览器设置中允许。');
                } else {
                    alert('录音启动失败：' + err.message);
                }
            }
        }

        function stopVoiceInput() {
            if (!isRecording) return;
            isRecording = false;
            clearInterval(recordTimer);

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').textContent = '🎤 语音输入';
            
            const overlay = document.getElementById('voiceOverlay');
            overlay.querySelector('.voice-text').textContent = '⏳ 识别中...';
            overlay.querySelector('.voice-hint').textContent = '正在将语音转为文字';
        }

        function showVoiceResult(title, hint) {
            const overlay = document.getElementById('voiceOverlay');
            overlay.querySelector('.voice-text').textContent = title;
            overlay.querySelector('.voice-hint').textContent = hint;
            const closeHandler = (e) => {
                e.preventDefault();
                overlay.classList.remove('active');
            };
            overlay.addEventListener('click', closeHandler, { once: true });
            overlay.addEventListener('touchend', closeHandler, { once: true });
        }

        function hideOverlayLater(ms = 3000) {
            setTimeout(() => {
                document.getElementById('voiceOverlay').classList.remove('active');
            }, ms);
        }

        // 通用语音转文字（上传到 SiliconFlow SenseVoice）
        async function transcribeAudio(audioBlobOrFile) {
            try {
                const formData = new FormData();
                
                // 确定文件名和格式
                let fileName = 'recording.webm';
                if (audioBlobOrFile instanceof File) {
                    fileName = audioBlobOrFile.name;
                } else if (audioBlobOrFile.type) {
                    const ext = audioBlobOrFile.type.split('/')[1]?.split(';')[0] || 'webm';
                    fileName = `recording.${ext}`;
                }

                formData.append('file', audioBlobOrFile, fileName);
                formData.append('model', 'FunAudioLLM/SenseVoiceSmall');
                formData.append('language', 'zh');

                const response = await fetch('https://api.siliconflow.cn/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEY}` },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || `识别失败(${response.status})`);
                }

                const data = await response.json();
                const text = data.text || '';

                if (text.trim()) {
                    const input = document.getElementById('userInput');
                    input.value = input.value ? input.value + text : text;
                    input.style.height = 'auto';
                    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
                    
                    const conv = getCurrentConversation();
                    if (conv) conv.inputText = input.value;

                    showVoiceResult('✅ ' + text, '已填入输入框');
                    hideOverlayLater(2500);
                } else {
                    showVoiceResult('🤔 未识别到语音', '请确保说话清晰后重试');
                    hideOverlayLater(3000);
                }

            } catch (err) {
                console.error('语音识别错误:', err);
                showVoiceResult('❌ ' + err.message, '可改用键盘自带语音输入');
                hideOverlayLater(4000);
            }
        }

        // 通过CORS代理获取内容
        async function fetchWithProxy(url) {
            const proxies = [
                u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                u => `https://corsproxy.org/?${encodeURIComponent(u)}`,
            ];
            for (const proxy of proxies) {
                try {
                    const resp = await fetch(proxy(url), { signal: AbortSignal.timeout(4000) });
                    if (resp.ok) return await resp.text();
                } catch (e) { continue; }
            }
            return null;
        }

        // 直接调用DuckDuckGo即时答案API（原生支持CORS）
        async function fetchDuckDuckGoInstant(query) {
            try {
                const resp = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`, {
                    signal: AbortSignal.timeout(4000)
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const results = [];
                    if (data.AbstractText) {
                        results.push({ title: data.Heading || query, snippet: data.AbstractText, source: 'DuckDuckGo' });
                    }
                    if (data.RelatedTopics) {
                        data.RelatedTopics.slice(0, 5).forEach(topic => {
                            if (topic.Text && topic.FirstURL) {
                                results.push({ title: topic.Text.substring(0, 80), snippet: topic.Text, source: 'DuckDuckGo' });
                            }
                        });
                    }
                    return results;
                }
            } catch (e) { console.log('DuckDuckGo API失败:', e); }
            return [];
        }

        // 直接调用维基百科API（原生支持CORS）
        async function fetchWikipedia(query) {
            try {
                const resp = await fetch(`https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=5&format=json&origin=*`, {
                    signal: AbortSignal.timeout(4000)
                });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.query && data.query.search) {
                        return data.query.search.map(item => ({
                            title: item.title,
                            snippet: item.snippet.replace(/<[^>]+>/g, ''),
                            source: '维基百科'
                        }));
                    }
                }
            } catch (e) { console.log('维基百科API失败:', e); }
            return [];
        }

        // 解析百度搜索结果
        function parseBaiduResults(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const results = [];
            const containers = doc.querySelectorAll('.c-container, .result, [class*="result"]');
            containers.forEach(container => {
                const titleEl = container.querySelector('h3, .t, [class*="title"]');
                const snippetEl = container.querySelector('.c-abstract, [class*="abstract"], [class*="content"], .c-span-last');
                if (titleEl) {
                    const title = titleEl.textContent.trim();
                    const snippet = snippetEl ? snippetEl.textContent.trim() : '';
                    if (title && title.length > 2) {
                        results.push({ title, snippet, source: '百度' });
                    }
                }
            });
            return results.slice(0, 5);
        }

        // 主搜索函数：多源搜索并整合结果
        async function performWebSearch(query) {
            let allResults = [];

            // 1. 尝试DuckDuckGo即时答案API（直接调用，无需代理）
            const ddgResults = await fetchDuckDuckGoInstant(query);
            allResults = allResults.concat(ddgResults);

            // 2. 尝试维基百科API（直接调用，无需代理）
            const wikiResults = await fetchWikipedia(query);
            allResults = allResults.concat(wikiResults);

            // 3. 尝试通过CORS代理获取百度搜索
            if (allResults.length === 0) {
                try {
                    const baiduUrl = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`;
                    const baiduHtml = await fetchWithProxy(baiduUrl);
                    if (baiduHtml) {
                        const baiduResults = parseBaiduResults(baiduHtml);
                        allResults = allResults.concat(baiduResults);
                    }
                } catch (e) { console.log('百度搜索失败:', e); }
            }

            // 4. 尝试通过CORS代理获取DuckDuckGo HTML搜索
            if (allResults.length < 3) {
                try {
                    const ddgHtmlUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
                    const ddgHtml = await fetchWithProxy(ddgHtmlUrl);
                    if (ddgHtml) {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(ddgHtml, 'text/html');
                        const items = doc.querySelectorAll('.result, .web-result, article');
                        items.forEach(item => {
                            const titleEl = item.querySelector('.result__title, .result__a, h2, h3');
                            const snippetEl = item.querySelector('.result__snippet, .result__body');
                            if (titleEl) {
                                const title = titleEl.textContent.trim();
                                const snippet = snippetEl ? snippetEl.textContent.trim() : '';
                                if (title && title.length > 2) {
                                    allResults.push({ title, snippet, source: 'DuckDuckGo' });
                                }
                            }
                        });
                    }
                } catch (e) { console.log('DuckDuckGo HTML搜索失败:', e); }
            }

            // 去重（按标题前20字符）
            const seen = new Set();
            const unique = [];
            for (const r of allResults) {
                const key = r.title.substring(0, 20);
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(r);
                }
            }

            return unique.slice(0, 10);
        }

        // 将搜索结果格式化为AI上下文本
        function formatSearchResultsForAI(results, query) {
            if (results.length === 0) return '';
            let text = `以下是关于"${query}"的联网搜索结果，请基于这些信息回答用户的问题，并在回答末尾标注信息来源：\n\n`;
            results.forEach((r, i) => {
                text += `【${i + 1}】${r.title}`;
                if (r.snippet) text += `\n${r.snippet}`;
                text += ` (来源: ${r.source})\n\n`;
            });
            return text;
        }

        let conversations = {};
        let currentConvId = null;

        // ===== Conversation Management =====

        function generateId() {
            return 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function createConversationData(id, title) {
            return {
                id: id,
                title: title || '新对话',
                messages: [{ role: 'system', content: SYSTEM_PROMPT }],
                createdAt: Date.now(),
                updatedAt: Date.now(),
                isLoading: false,
                currentImages: [],
                inputText: '',
                workspaceFiles: []
            };
        }

        function loadConversations() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    conversations = JSON.parse(data);
                    // 重置所有卡死的 isLoading 状态（防止页面刷新后按钮永久禁用）
                    Object.values(conversations).forEach(conv => {
                        conv.isLoading = false;
                    });
                    saveConversations();
                }
            } catch (e) {
                console.error('加载对话列表失败:', e);
                conversations = {};
            }
        }

        function saveConversations() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
            } catch (e) {
                console.error('保存对话失败:', e);
            }
        }

        function createNewChat() {
            const id = generateId();
            conversations[id] = createConversationData(id);
            saveConversations();
            switchToConversation(id);
            renderConversationList();
        }

        function switchToConversation(id) {
            if (!conversations[id]) return;
            
            // Save current conversation's input state before switching
            if (currentConvId && conversations[currentConvId]) {
                const prevConv = conversations[currentConvId];
                prevConv.inputText = document.getElementById('userInput').value;
            }
            
            currentConvId = id;
            const conv = conversations[id];
            
            // Restore input state
            const input = document.getElementById('userInput');
            input.value = conv.inputText || '';
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            
            // Restore image state
            if (conv.currentImages && conv.currentImages.length > 0) {
                renderImagePreviews(conv.currentImages);
            } else {
                removeImage();
            }
            
            // Update send button state
            document.getElementById('sendBtn').disabled = conv.isLoading;
            
            renderMessages();
            renderConversationList();
            updateFeynmanUI();
            if (workspaceOpen) renderWorkspace();
            
            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('collapsed');
            }
        }

        function deleteConversation(id, event) {
            event.stopPropagation();
            if (!confirm('确定要删除这个对话吗？')) return;
            
            delete conversations[id];
            saveConversations();
            
            if (currentConvId === id) {
                const remaining = Object.keys(conversations);
                if (remaining.length > 0) {
                    switchToConversation(remaining[remaining.length - 1]);
                } else {
                    createNewChat();
                }
            }
            renderConversationList();
        }

        function getCurrentConversation() {
            return conversations[currentConvId];
        }

        function getMessages() {
            const conv = getCurrentConversation();
            return conv ? conv.messages : [{ role: 'system', content: SYSTEM_PROMPT }];
        }

        function updateConversationTitle() {
            const conv = getCurrentConversation();
            if (!conv || conv.title !== '新对话') return;
            
            const userMsgs = conv.messages.filter(m => m.role === 'user');
            if (userMsgs.length > 0) {
                const firstMsg = userMsgs[0];
                let text = '';
                if (Array.isArray(firstMsg.content)) {
                    const textPart = firstMsg.content.find(c => c.type === 'text');
                    text = textPart ? textPart.text : '图片对话';
                } else {
                    text = firstMsg.content;
                }
                conv.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                conv.updatedAt = Date.now();
                saveConversations();
                renderConversationList();
            }
        }

        // ===== Rendering =====

        function renderConversationList() {
            const list = document.getElementById('conversationList');
            const sorted = Object.values(conversations).sort((a, b) => b.updatedAt - a.updatedAt);
            
            if (sorted.length === 0) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:0.85rem;">暂无对话</div>';
                return;
            }
            
            list.innerHTML = sorted.map(conv => `
                <div class="conv-item ${conv.id === currentConvId ? 'active' : ''}" onclick="switchToConversation('${conv.id}')">
                    <div class="conv-info">
                        <div class="conv-title">${escapeHtml(conv.title)}${conv.isLoading ? ' <span style="color:#6366f1;font-size:0.7rem;">⏳</span>' : ''}</div>
                        <div class="conv-time">${formatTime(conv.updatedAt)}</div>
                    </div>
                    <button class="conv-delete" onclick="deleteConversation('${conv.id}', event)" title="删除">×</button>
                </div>
            `).join('');
        }

        function renderMessages() {
            const container = document.getElementById('chatContainer');
            const conv = getCurrentConversation();
            const msgs = getMessages().filter(m => m.role !== 'system');
            
            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">开始你的学习对话吧</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';

            // 费曼模式显示介绍卡片
            if (conv && (conv.mode === 'feynman' || conv.mode === 'feynman_done')) {
                container.innerHTML = `
                    <div class="feynman-intro">
                        <h3>🎓 费曼学习法</h3>
                        <p>用最简单的话把知识讲给别人听，是检验你是否真正掌握的最好方法。</p>
                        <p style="margin-top:8px;color:#78350f;"><strong>规则：</strong>你来当老师，我来当好奇的同学。我会不断追问，直到你能把问题讲得连"小白"都听懂为止。</p>
                    </div>
                `;
            }

            msgs.forEach(msg => {
                // 跳过费曼模式的内部评估指令
                if (msg.content === '[请给出最终评估]') return;
                if (Array.isArray(msg.content)) {
                    const text = msg.content.find(c => c.type === 'text')?.text || '';
                    const images = msg.content.filter(c => c.type === 'image_url').map(c => c.image_url?.url);
                    addMessage(msg.role === 'user' ? 'user' : 'ai', text, images, false);
                } else {
                    addMessage(msg.role === 'user' ? 'user' : 'ai', msg.content, [], false);
                }
            });
            container.scrollTop = container.scrollHeight;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
            
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Sidebar Toggle =====

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // ===== Message Handling =====

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function handlePaste(e) {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    addImage(file);
                    break;
                }
            }
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    addImage(file);
                }
            });
            e.target.value = '';
        }

        function addImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const conv = getCurrentConversation();
                if (conv) {
                    if (!conv.currentImages) conv.currentImages = [];
                    conv.currentImages.push(e.target.result);
                    saveConversations();
                    renderImagePreviews(conv.currentImages);
                }
            };
            reader.readAsDataURL(file);
        }

        function removeImage(index) {
            const conv = getCurrentConversation();
            if (conv && conv.currentImages) {
                conv.currentImages.splice(index, 1);
                saveConversations();
                if (conv.currentImages.length > 0) {
                    renderImagePreviews(conv.currentImages);
                } else {
                    document.getElementById('imagePreview').innerHTML = '';
                }
            }
        }

        function removeAllImages() {
            const conv = getCurrentConversation();
            if (conv) {
                conv.currentImages = [];
                saveConversations();
            }
            document.getElementById('imagePreview').innerHTML = '';
        }

        function renderImagePreviews(images) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = images.map((src, i) => `
                <div class="image-preview">
                    <img src="${src}" alt="预览${i + 1}">
                    <button class="remove-btn" onclick="removeImage(${i})">×</button>
                </div>
            `).join('');
        }

        function quickAsk(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            // Ensure we have a conversation
            if (!currentConvId || !conversations[currentConvId]) {
                createNewChat();
            }
            
            const conv = getCurrentConversation();
            const images = conv.currentImages || [];
            
            if ((!text && images.length === 0) || conv.isLoading) return;

            conv.isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            // Build message content
            let content = [];
            images.forEach(img => {
                content.push({ type: 'image_url', image_url: { url: img } });
            });
            if (text) {
                content.push({ type: 'text', text: text });
            }

            // Display user message
            addMessage('user', text, images);
            
            // Save to conversation
            conv.messages.push({ role: 'user', content: content });
            conv.updatedAt = Date.now();
            saveConversations();
            updateConversationTitle();

            // Clear input
            input.value = '';
            input.style.height = 'auto';
            conv.inputText = '';
            conv.currentImages = [];
            removeAllImages();
            saveConversations();

            const typingId = showTyping();
            let searchResults = [];

            try {
                // 如果联网搜索已开启且非费曼模式，先搜索再回答
                const isFeynmanMode = conv.mode === 'feynman' || conv.mode === 'feynman_done';
                if (webSearchEnabled && text && !isFeynmanMode) {
                    const searchStatusId = showSearchStatus('正在联网搜索：' + text);
                    
                    // 给搜索加全局超时（15秒）
                    try {
                        searchResults = await Promise.race([
                            performWebSearch(text),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('搜索超时')), 15000))
                        ]);
                    } catch (searchError) {
                        console.log('搜索超时或失败:', searchError);
                        searchResults = [];
                    }
                    removeSearchStatus(searchStatusId);
                    
                    if (searchResults.length > 0) {
                        const searchContext = formatSearchResultsForAI(searchResults, text);
                        const statusId2 = showSearchStatus(`已找到 ${searchResults.length} 条相关信息，正在整合分析...`);
                        
                        // 记录当前消息数量，方便之后清理临时上下文
                        const msgCountBeforeSearch = conv.messages.length;
                        
                        // 临时注入搜索上下文（仅用于本次API调用）
                        conv.messages.push({ role: 'user', content: '[联网搜索结果]\n' + searchContext });
                        conv.messages.push({ role: 'assistant', content: '好的，我已获取到搜索结果，正在整理答案...' });
                        // 再次加入用户原始消息，让AI基于上下文回答
                        conv.messages.push({ role: 'user', content: content });

                        const searchController = new AbortController();
                        const searchTimeoutId = setTimeout(() => searchController.abort(), 90000);

                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${API_KEY}`
                            },
                            body: JSON.stringify({
                                model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                                messages: conv.messages,
                                temperature: 0.7,
                                max_tokens: 2000,
                                stream: true
                            }),
                            signal: searchController.signal
                        });

                        clearTimeout(searchTimeoutId);
                        removeSearchStatus(statusId2);
                        removeTyping(typingId);

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.message || `API 错误：${response.status}`);
                        }

                        // 流式读取搜索结果回复
                        const bubble = createStreamingBubble();
                        let fullReply = '';
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let lastRender = 0;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (!trimmed || !trimmed.startsWith('data: ')) continue;
                                const data = trimmed.slice(6);
                                if (data === '[DONE]') continue;

                                try {
                                    const json = JSON.parse(data);
                                    const delta = json.choices?.[0]?.delta?.content;
                                    if (delta) {
                                        fullReply += delta;
                                        const now = Date.now();
                                        if (now - lastRender > 100) {
                                            bubble.innerHTML = formatMessage(fullReply) + '<span class="streaming-cursor">▊</span>';
                                            const container = document.getElementById('chatContainer');
                                            container.scrollTop = container.scrollHeight;
                                            lastRender = now;
                                        }
                                    }
                                } catch (e) { /* 忽略解析错误 */ }
                            }
                        }

                        // 最终渲染
                        bubble.innerHTML = formatMessage(fullReply);
                        // 添加搜索来源
                        let sourcesHtml = '<div class="search-sources"><details><summary>📋 信息来源（' + searchResults.length + ' 条）</summary>';
                        searchResults.forEach(r => {
                            sourcesHtml += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                        });
                        sourcesHtml += '</details></div>';
                        bubble.innerHTML += sourcesHtml;

                        const chatContainer = document.getElementById('chatContainer');
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        // 清理临时搜索上下文：截断到搜索前的消息数
                        conv.messages.length = msgCountBeforeSearch;
                        // 添加正式的AI回复
                        conv.messages.push({ role: 'assistant', content: fullReply });
                        conv.updatedAt = Date.now();
                        saveConversations();
                    } else {
                        // 搜索无结果，明确告知用户
                        const statusId2 = showSearchStatus('⚠️ 联网搜索未获取到结果，将基于AI自身知识回答（可能不准确）');
                        await new Promise(r => setTimeout(r, 1500));
                        removeSearchStatus(statusId2);
                        
                        // 添加警告消息到对话
                        conv.messages.push({ role: 'assistant', content: '⚠️ 联网搜索未能获取到相关信息（可能是网络问题或服务暂时不可用）。以下回答基于AI自身知识，可能不够准确或时效性不足，仅供参考。' });
                        await callAI(conv, content, typingId, []);
                    }
                } else {
                    // 未开启联网搜索，正常调用AI
                    await callAI(conv, content, typingId, []);
                }

            } catch (error) {
                removeTyping(typingId);
                addMessage('ai', `出错了：${error.message}。请检查网络连接或 API Key。`);
            } finally {
                // 无论如何都要重置状态，防止按钮卡死
                conv.isLoading = false;
                saveConversations();
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        // 创建流式消息气泡（逐字显示）
        function createStreamingBubble() {
            const container = document.getElementById('chatContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = 'message ai';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble"><span class="streaming-cursor">▊</span></div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.querySelector('.bubble');
        }

        // 流式AI调用函数（逐字输出，带超时保护）
        async function callAI(conv, content, typingId, searchResults) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 90000); // 90秒超时（流式需要更长）

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                        messages: conv.messages,
                        temperature: 0.7,
                        max_tokens: 2000,
                        stream: true
                    }),
                    signal: controller.signal
                });

                removeTyping(typingId);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `API 错误：${response.status}`);
                }

                // 流式读取响应
                const bubble = createStreamingBubble();
                let fullReply = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let lastRender = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留未完成的行

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        const data = trimmed.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullReply += delta;
                                // 每100ms更新一次显示，避免过度渲染
                                const now = Date.now();
                                if (now - lastRender > 100) {
                                    bubble.innerHTML = formatMessage(fullReply) + '<span class="streaming-cursor">▊</span>';
                                    const container = document.getElementById('chatContainer');
                                    container.scrollTop = container.scrollHeight;
                                    lastRender = now;
                                }
                            }
                        } catch (e) { /* 忽略解析错误 */ }
                    }
                }

                // 最终渲染（去掉光标）
                bubble.innerHTML = formatMessage(fullReply);
                // 添加搜索来源
                if (searchResults && searchResults.length > 0) {
                    let sourcesHtml = '<div class="search-sources"><details><summary>📋 信息来源（' + searchResults.length + ' 条）</summary>';
                    searchResults.forEach(r => {
                        sourcesHtml += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                    });
                    sourcesHtml += '</details></div>';
                    bubble.innerHTML += sourcesHtml;
                }

                const container = document.getElementById('chatContainer');
                container.scrollTop = container.scrollHeight;

                conv.messages.push({ role: 'assistant', content: fullReply });
                conv.updatedAt = Date.now();
                saveConversations();
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function addMessage(role, text, images, save = true, searchSources = []) {
            const container = document.getElementById('chatContainer');
            
            // Remove empty state if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            let html = '';
            if (images && images.length > 0) {
                images.forEach(img => {
                    html += `<img src="${img}" alt="用户图片">`;
                });
            }
            if (text) {
                html += formatMessage(text);
            }
            // 添加搜索来源
            if (searchSources && searchSources.length > 0) {
                html += '<div class="search-sources">';
                html += '<details><summary>📋 信息来源（' + searchSources.length + ' 条）</summary>';
                searchSources.forEach(r => {
                    html += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                });
                html += '</details></div>';
            }
            bubble.innerHTML = html;

            div.appendChild(avatar);
            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function formatMessage(text) {
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/^\* (.+)$/gm, '<li>$1</li>');
            text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
            text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            text = text.replace(/\n\n/g, '</p><p>');
            text = '<p>' + text + '</p>';
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/<p><\/p>/g, '');
            text = text.replace(/<p>(<h3>)/g, '$1');
            text = text.replace(/(<\/h3>)<\/p>/g, '$1');
            text = text.replace(/<p>(<ul>)/g, '$1');
            text = text.replace(/(<\/ul>)<\/p>/g, '$1');
            text = text.replace(/<p>(<pre>)/g, '$1');
            text = text.replace(/(<\/pre>)<\/p>/g, '$1');
            return text;
        }

        function showTyping() {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typing-' + Date.now();

            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.id;
        }

        function showSearchStatus(text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'search-status';
            div.id = 'search-status-' + Date.now();
            div.innerHTML = `<div class="spinner"></div><span>${escapeHtml(text)}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.id;
        }

        function removeSearchStatus(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function updateSearchStatus(id, text) {
            const el = document.getElementById(id);
            if (el) {
                el.querySelector('span').textContent = text;
            }
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            // Save input text to current conversation
            const conv = getCurrentConversation();
            if (conv) {
                conv.inputText = this.value;
            }
        });

        // ===== 工作区面板 =====

        let workspaceOpen = false;

        function toggleWorkspace() {
            workspaceOpen = !workspaceOpen;
            const panel = document.getElementById('workspacePanel');
            const toggle = document.getElementById('workspaceToggle');
            panel.classList.toggle('collapsed', !workspaceOpen);
            toggle.classList.toggle('active', workspaceOpen);
            if (workspaceOpen) renderWorkspace();
        }

        function getWorkspaceFiles() {
            const conv = getCurrentConversation();
            if (!conv) return [];
            if (!conv.workspaceFiles) conv.workspaceFiles = [];
            return conv.workspaceFiles;
        }

        function handleWorkspaceUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            event.target.value = '';

            const conv = getCurrentConversation();
            if (!conv) return;
            if (!conv.workspaceFiles) conv.workspaceFiles = [];

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const item = {
                        id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        dataUrl: e.target.result,
                        addedAt: Date.now()
                    };
                    conv.workspaceFiles.push(item);
                    saveConversations();
                    renderWorkspace();
                };
                // 图片用 DataURL，其他文件只存元信息
                if (file.type.startsWith('image/') && file.size < 5 * 1024 * 1024) {
                    reader.readAsDataURL(file);
                } else if (file.size < 2 * 1024 * 1024) {
                    reader.readAsDataURL(file);
                } else {
                    // 大文件只存信息不存内容
                    conv.workspaceFiles.push({
                        id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        dataUrl: null,
                        addedAt: Date.now()
                    });
                    saveConversations();
                    renderWorkspace();
                }
            });
        }

        function removeWorkspaceItem(id) {
            const conv = getCurrentConversation();
            if (!conv || !conv.workspaceFiles) return;
            conv.workspaceFiles = conv.workspaceFiles.filter(f => f.id !== id);
            saveConversations();
            renderWorkspace();
        }

        function renderWorkspace() {
            const container = document.getElementById('workspaceItems');
            const files = getWorkspaceFiles();

            if (files.length === 0) {
                container.innerHTML = '<div class="workspace-empty"><div class="empty-icon">📁</div>还没有文件<br>上传图片或文档到工作区<br>对话时可随时引用</div>';
                return;
            }

            const images = files.filter(f => f.type && f.type.startsWith('image/'));
            const others = files.filter(f => !f.type || !f.type.startsWith('image/'));

            let html = '';

            if (images.length > 0) {
                html += '<div class="workspace-section-title">图片 (' + images.length + ')</div>';
                html += '<div class="workspace-grid">';
                images.forEach(img => {
                    html += `<div class="workspace-item" onclick="openLightbox('${img.dataUrl || ''}')">
                        <img src="${img.dataUrl || ''}" alt="${escapeHtml(img.name)}">
                        <div class="item-name">${escapeHtml(img.name)}</div>
                        <button class="item-remove" onclick="event.stopPropagation();removeWorkspaceItem('${img.id}')">×</button>
                    </div>`;
                });
                html += '</div>';
            }

            if (others.length > 0) {
                html += '<div class="workspace-section-title">文件 (' + others.length + ')</div>';
                others.forEach(file => {
                    const icon = getFileIcon(file.type, file.name);
                    const size = formatFileSize(file.size);
                    html += `<div class="workspace-file-item">
                        <span class="file-icon">${icon}</span>
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            <div class="file-size">${size}</div>
                        </div>
                        <button class="file-remove" onclick="removeWorkspaceItem('${file.id}')">×</button>
                    </div>`;
                });
            }

            container.innerHTML = html;
        }

        function getFileIcon(type, name) {
            if (!type) type = '';
            if (type.includes('pdf') || name.endsWith('.pdf')) return '📕';
            if (type.includes('word') || name.match(/\.docx?$/)) return '📘';
            if (type.includes('excel') || name.match(/\.xlsx?$/)) return '📗';
            if (type.includes('powerpoint') || name.match(/\.pptx?$/)) return '📙';
            if (type.includes('text') || name.match(/\.(txt|md)$/)) return '📄';
            if (type.includes('zip') || type.includes('rar')) return '📦';
            return '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function openLightbox(src) {
            if (!src) return;
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightboxImg').src = '';
        }

        // 拖拽上传支持
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('workspaceDrop');
            const panel = document.getElementById('workspacePanel');

            ['dragenter', 'dragover'].forEach(evt => {
                panel.addEventListener(evt, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach(evt => {
                panel.addEventListener(evt, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                });
            });
            panel.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    // 复用上传逻辑
                    const input = document.getElementById('workspaceFileInput');
                    input.files = files;
                    handleWorkspaceUpload({ target: input });
                }
            });
        });

        // ===== Share Conversation =====

        function shareConversation() {
            const conv = getCurrentConversation();
            if (!conv) return;
            
            const chatMessages = conv.messages.filter(m => m.role !== 'system');
            if (chatMessages.length === 0) {
                alert('还没有对话内容，先聊点什么再分享吧');
                return;
            }

            // 精简消息结构，减少数据量
            const slim = chatMessages.map(m => {
                if (typeof m.content === 'string') return { r: m.role[0], c: m.content };
                // 多模态消息（含图片）只保留文本部分
                const textParts = m.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
                return { r: m.role[0], c: textParts || '' };
            });

            const json = JSON.stringify(slim);
            // 使用 LZ-String 压缩（比纯 base64 短 50-70%）
            const encoded = (typeof LZString !== 'undefined')
                ? LZString.compressToEncodedURIComponent(json)
                : btoa(unescape(encodeURIComponent(json)));
            const url = window.location.origin + window.location.pathname + '#share=' + encoded;

            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.header-btn');
                const original = btn.textContent;
                btn.textContent = '已复制!';
                btn.style.background = '#dcfce7';
                btn.style.color = '#16a34a';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(() => {
                prompt('复制以下链接分享：', url);
            });
        }

        function loadSharedConversation() {
            const hash = window.location.hash;
            if (!hash.startsWith('#share=')) return false;

            const encoded = hash.substring(7);
            try {
                let json;
                // 尝试 LZ-String 解压（新格式）
                if (typeof LZString !== 'undefined') {
                    json = LZString.decompressFromEncodedURIComponent(encoded);
                }
                // 回退到 base64（旧格式兼容）
                if (!json) {
                    json = decodeURIComponent(escape(atob(encoded)));
                }

                const data = JSON.parse(json);
                if (!Array.isArray(data) || data.length === 0) return false;

                // 支持新精简格式 {r:'u',c:'...'} 和旧完整格式 {role:'user',content:'...'}
                const chatMessages = data.map(m => {
                    if (m.r) {
                        const roleMap = { u: 'user', a: 'assistant', s: 'system' };
                        return { role: roleMap[m.r] || m.r, content: m.c };
                    }
                    return m;
                });

                // Create a new conversation for the shared content
                const id = generateId();
                conversations[id] = createConversationData(id, '分享的对话');
                conversations[id].messages = [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages];
                saveConversations();
                switchToConversation(id);
                renderConversationList();
                
                // Add notice
                const container = document.getElementById('chatContainer');
                const notice = document.createElement('div');
                notice.style.cssText = 'text-align:center;padding:8px;color:#6b7280;font-size:0.85rem;';
                notice.textContent = '— 以上是分享的对话内容，你可以继续提问 —';
                container.appendChild(notice);
                container.scrollTop = container.scrollHeight;

                return true;
            } catch (e) {
                console.error('加载分享对话失败:', e);
                return false;
            }
        }

        // ===== Initialization =====

        function init() {
            loadConversations();
            
            // Check for shared conversation in URL
            const hasShared = loadSharedConversation();
            
            if (!hasShared) {
                // Load existing or create new conversation
                const convIds = Object.keys(conversations);
                if (convIds.length > 0) {
                    const sorted = Object.values(conversations).sort((a, b) => b.updatedAt - a.updatedAt);
                    switchToConversation(sorted[0].id);
                } else {
                    createNewChat();
                }
            }
            
            renderConversationList();
            updateFeynmanUI();
        }

        init();
    </script>
