                btn.textContent = ' 联网搜索';
            }
        }

        // ===== 语音输入（移动端用原生录音，桌面端用 MediaRecorder） =====

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordTimer = null;
        let recordSeconds = 0;

        // 检测是否为移动设备
        function isMobile() {
            return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || 'ontouchstart' in window;
        }

        function toggleVoiceInput() {
            if (isRecording) {
                stopVoiceInput();
                return;
            }

            if (isMobile()) {
                // 移动端：调起原生录音器（兼容微信/QQ/UC/Chrome/Safari）
                document.getElementById('audioInput').click();
            } else {
                // 桌面端：使用 MediaRecorder
                startDesktopRecording();
            }
        }

        // 移动端：处理原生录音文件
        async function handleAudioFile(event) {
            const file = event.target.files[0];
            event.target.value = ''; // 重置，允许重复选择
            
            if (!file) return;

            const overlay = document.getElementById('voiceOverlay');
            overlay.classList.add('active');
            overlay.querySelector('.voice-text').textContent = '⏳ 识别中...';
            overlay.querySelector('.voice-hint').textContent = `正在识别 "${file.name}" (${(file.size/1024).toFixed(0)}KB)`;

            await transcribeAudio(file);
        }

        // 桌面端：MediaRecorder 录音
        async function startDesktopRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
                alert('你的浏览器不支持录音功能。\n\n替代方案：点击输入框，使用键盘自带的语音输入。');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                
                let mimeType = '';
                const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
                for (const type of types) {
                    try {
                        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
                            mimeType = type;
                            break;
                        }
                    } catch (e) {}
                }

                mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                audioChunks = [];
                recordSeconds = 0;

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    clearInterval(recordTimer);
                    
                    if (audioChunks.length === 0) {
                        showVoiceResult('❌ 未录到音频', '请重试');
                        hideOverlayLater();
                        return;
                    }

                    const finalType = mimeType || mediaRecorder.mimeType || 'audio/webm';
                    const blob = new Blob(audioChunks, { type: finalType });
                    
                    if (blob.size < 500) {
                        showVoiceResult('❌ 录音太短', '请至少说1秒以上');
                        hideOverlayLater();
                        return;
                    }

                    await transcribeAudio(blob);
                };

                mediaRecorder.start(250);
                isRecording = true;

                document.getElementById('voiceBtn').classList.add('recording');
                document.getElementById('voiceBtn').textContent = '⏹ 停止';
                const overlay = document.getElementById('voiceOverlay');
                overlay.classList.add('active');
                overlay.querySelector('.voice-text').textContent = '🎤 正在听...';
                overlay.querySelector('.voice-hint').textContent = '说完后点击此处停止（最长60秒）';

                const stopHandler = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    stopVoiceInput();
                };
                overlay.addEventListener('click', stopHandler, { once: true });

                recordTimer = setInterval(() => {
                    recordSeconds++;
                    overlay.querySelector('.voice-text').textContent = `🎤 正在听... (${recordSeconds}s)`;
                    if (recordSeconds >= 60) stopVoiceInput();
                }, 1000);

            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    alert('麦克风权限被拒绝，请在浏览器设置中允许。');
                } else {
                    alert('录音启动失败：' + err.message);
                }
            }
        }

        function stopVoiceInput() {
            if (!isRecording) return;
            isRecording = false;
            clearInterval(recordTimer);

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            document.getElementById('voiceBtn').classList.remove('recording');
            document.getElementById('voiceBtn').textContent = '🎤 语音输入';
            
            const overlay = document.getElementById('voiceOverlay');
            overlay.querySelector('.voice-text').textContent = '⏳ 识别中...';
            overlay.querySelector('.voice-hint').textContent = '正在将语音转为文字';
        }

        function showVoiceResult(title, hint) {
            const overlay = document.getElementById('voiceOverlay');
            overlay.querySelector('.voice-text').textContent = title;
            overlay.querySelector('.voice-hint').textContent = hint;
            const closeHandler = (e) => {
                e.preventDefault();
                overlay.classList.remove('active');
            };
            overlay.addEventListener('click', closeHandler, { once: true });
            overlay.addEventListener('touchend', closeHandler, { once: true });
        }

        function hideOverlayLater(ms = 3000) {
            setTimeout(() => {
                document.getElementById('voiceOverlay').classList.remove('active');
            }, ms);
        }

        // 通用语音转文字（上传到 SiliconFlow SenseVoice）
        async function transcribeAudio(audioBlobOrFile) {
            try {
                const formData = new FormData();
                
                // 确定文件名和格式
                let fileName = 'recording.webm';
                if (audioBlobOrFile instanceof File) {
                    fileName = audioBlobOrFile.name;
                } else if (audioBlobOrFile.type) {
                    const ext = audioBlobOrFile.type.split('/')[1]?.split(';')[0] || 'webm';
                    fileName = `recording.${ext}`;
                }

                formData.append('file', audioBlobOrFile, fileName);
                formData.append('model', 'FunAudioLLM/SenseVoiceSmall');
                formData.append('language', 'zh');

                const response = await fetch('https://api.siliconflow.cn/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEY}` },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || `识别失败(${response.status})`);
                }

                const data = await response.json();
                const text = data.text || '';

                if (text.trim()) {
                    const input = document.getElementById('userInput');
                    input.value = input.value ? input.value + text : text;
                    input.style.height = 'auto';
                    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
                    
                    const conv = getCurrentConversation();
                    if (conv) conv.inputText = input.value;

                    showVoiceResult('✅ ' + text, '已填入输入框');
                    hideOverlayLater(2500);
                } else {
                    showVoiceResult('🤔 未识别到语音', '请确保说话清晰后重试');
                    hideOverlayLater(3000);
                }

            } catch (err) {
                console.error('语音识别错误:', err);
                showVoiceResult('❌ ' + err.message, '可改用键盘自带语音输入');
                hideOverlayLater(4000);
            }
        }

        // 通过CORS代理获取内容
        async function fetchWithProxy(url) {
            const proxies = [
                u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                u => `https://corsproxy.org/?${encodeURIComponent(u)}`,
            ];
            for (const proxy of proxies) {
                try {
                    const resp = await fetch(proxy(url), { signal: AbortSignal.timeout(4000) });
                    if (resp.ok) return await resp.text();
                } catch (e) { continue; }
            }
            return null;
        }

        // 直接调用DuckDuckGo即时答案API（原生支持CORS）
        async function fetchDuckDuckGoInstant(query) {
            try {
                const resp = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`, {
                    signal: AbortSignal.timeout(4000)
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const results = [];
                    if (data.AbstractText) {
                        results.push({ title: data.Heading || query, snippet: data.AbstractText, source: 'DuckDuckGo' });
                    }
                    if (data.RelatedTopics) {
                        data.RelatedTopics.slice(0, 5).forEach(topic => {
                            if (topic.Text && topic.FirstURL) {
                                results.push({ title: topic.Text.substring(0, 80), snippet: topic.Text, source: 'DuckDuckGo' });
                            }
                        });
                    }
                    return results;
                }
            } catch (e) { console.log('DuckDuckGo API失败:', e); }
            return [];
        }

        // 直接调用维基百科API（原生支持CORS）
        async function fetchWikipedia(query) {
            try {
                const resp = await fetch(`https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=5&format=json&origin=*`, {
                    signal: AbortSignal.timeout(4000)
                });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.query && data.query.search) {
                        return data.query.search.map(item => ({
                            title: item.title,
                            snippet: item.snippet.replace(/<[^>]+>/g, ''),
                            source: '维基百科'
                        }));
                    }
                }
            } catch (e) { console.log('维基百科API失败:', e); }
            return [];
        }

        // 解析百度搜索结果
        function parseBaiduResults(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const results = [];
            const containers = doc.querySelectorAll('.c-container, .result, [class*="result"]');
            containers.forEach(container => {
                const titleEl = container.querySelector('h3, .t, [class*="title"]');
                const snippetEl = container.querySelector('.c-abstract, [class*="abstract"], [class*="content"], .c-span-last');
                if (titleEl) {
                    const title = titleEl.textContent.trim();
                    const snippet = snippetEl ? snippetEl.textContent.trim() : '';
                    if (title && title.length > 2) {
                        results.push({ title, snippet, source: '百度' });
                    }
                }
            });
            return results.slice(0, 5);
        }

        // 主搜索函数：多源搜索并整合结果
        async function performWebSearch(query) {
            let allResults = [];

            // 1. 尝试DuckDuckGo即时答案API（直接调用，无需代理）
            const ddgResults = await fetchDuckDuckGoInstant(query);
            allResults = allResults.concat(ddgResults);

            // 2. 尝试维基百科API（直接调用，无需代理）
            const wikiResults = await fetchWikipedia(query);
            allResults = allResults.concat(wikiResults);

            // 3. 尝试通过CORS代理获取百度搜索
            if (allResults.length === 0) {
                try {
                    const baiduUrl = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`;
                    const baiduHtml = await fetchWithProxy(baiduUrl);
                    if (baiduHtml) {
                        const baiduResults = parseBaiduResults(baiduHtml);
                        allResults = allResults.concat(baiduResults);
                    }
                } catch (e) { console.log('百度搜索失败:', e); }
            }

            // 4. 尝试通过CORS代理获取DuckDuckGo HTML搜索
            if (allResults.length < 3) {
                try {
                    const ddgHtmlUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
                    const ddgHtml = await fetchWithProxy(ddgHtmlUrl);
                    if (ddgHtml) {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(ddgHtml, 'text/html');
                        const items = doc.querySelectorAll('.result, .web-result, article');
                        items.forEach(item => {
                            const titleEl = item.querySelector('.result__title, .result__a, h2, h3');
                            const snippetEl = item.querySelector('.result__snippet, .result__body');
                            if (titleEl) {
                                const title = titleEl.textContent.trim();
                                const snippet = snippetEl ? snippetEl.textContent.trim() : '';
                                if (title && title.length > 2) {
                                    allResults.push({ title, snippet, source: 'DuckDuckGo' });
                                }
                            }
                        });
                    }
                } catch (e) { console.log('DuckDuckGo HTML搜索失败:', e); }
            }

            // 去重（按标题前20字符）
            const seen = new Set();
            const unique = [];
            for (const r of allResults) {
                const key = r.title.substring(0, 20);
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(r);
                }
            }

            return unique.slice(0, 10);
        }

        // 将搜索结果格式化为AI上下文本
        function formatSearchResultsForAI(results, query) {
            if (results.length === 0) return '';
            let text = `以下是关于"${query}"的联网搜索结果，请基于这些信息回答用户的问题，并在回答末尾标注信息来源：\n\n`;
            results.forEach((r, i) => {
                text += `【${i + 1}】${r.title}`;
                if (r.snippet) text += `\n${r.snippet}`;
                text += ` (来源: ${r.source})\n\n`;
            });
            return text;
        }

        let conversations = {};
        let currentConvId = null;

        // ===== Conversation Management =====

        function generateId() {
            return 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function createConversationData(id, title) {
            return {
                id: id,
                title: title || '新对话',
                messages: [{ role: 'system', content: SYSTEM_PROMPT }],
                createdAt: Date.now(),
                updatedAt: Date.now(),
                isLoading: false,
                currentImages: [],
                inputText: '',
                workspaceFiles: []
            };
        }

        function loadConversations() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    conversations = JSON.parse(data);
                    // 重置所有卡死的 isLoading 状态（防止页面刷新后按钮永久禁用）
                    Object.values(conversations).forEach(conv => {
                        conv.isLoading = false;
                    });
                    saveConversations();
                }
            } catch (e) {
                console.error('加载对话列表失败:', e);
                // 数据损坏时先备份原始内容，避免被新对话覆盖
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) localStorage.setItem(STORAGE_KEY + '_backup', raw);
                } catch (e2) { /* 忽略 */ }
                conversations = {};
            }
        }

        function saveConversations() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
            } catch (e) {
                // 存储空间不足：剥离大体积附件数据后重试，保住对话文字
                try {
                    Object.values(conversations).forEach(conv => {
                        (conv.workspaceFiles || []).forEach(f => { if (f.dataUrl) f.dataUrl = null; });
                        (conv.currentFiles || []).forEach(f => {
                            f.dataUrl = null;
                            if (f.content) f.content = '[附件内容因浏览器存储空间不足被移除]';
                        });
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
                    showToast('⚠️ 浏览器存储空间不足，已舍弃部分附件内容以保住对话记录');
                } catch (e2) {
                    console.error('保存对话失败:', e2);
                    showToast('⚠️ 保存失败：浏览器存储空间不足，请导出备份后清理旧对话');
                }
            }
        }

        // ===== 对话备份导出 / 导入 =====

        function exportBackup() {
            try {
                const blob = new Blob([JSON.stringify(conversations)], { type: 'application/json' });
                const a = document.createElement('a');
                const d = new Date();
                const pad = n => String(n).padStart(2, '0');
                a.href = URL.createObjectURL(blob);
                a.download = '学习助手备份-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 5000);
                showToast('备份文件已开始下载，请妥善保存');
            } catch (e) {
                showToast('导出失败：' + e.message);
            }
        }

        function importBackup(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(String(ev.target.result));
                    if (typeof data !== 'object' || data === null || Array.isArray(data)) throw new Error('格式不正确');
                    let count = 0;
                    Object.keys(data).forEach(id => {
                        const c = data[id];
                        if (c && Array.isArray(c.messages)) { conversations[id] = c; count++; }
                    });
                    if (count === 0) throw new Error('没有可用对话');
                    saveConversations();
                    renderConversationList();
                    const sorted = Object.values(conversations).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                    if (sorted.length > 0) switchToConversation(sorted[0].id);
                    showToast('已导入 ' + count + ' 条对话');
                } catch (e) {
                    showToast('导入失败：文件不是有效的备份文件');
                }
            };
            reader.readAsText(file);
        }

        function createNewChat() {
            const id = generateId();
            conversations[id] = createConversationData(id);
            saveConversations();
            switchToConversation(id);
            renderConversationList();
        }

        function switchToConversation(id) {
            if (!conversations[id]) return;
            
            // Save current conversation's input state before switching
            if (currentConvId && conversations[currentConvId]) {
                const prevConv = conversations[currentConvId];
                prevConv.inputText = document.getElementById('userInput').value;
            }
            
            currentConvId = id;
            const conv = conversations[id];
            
            // Restore input state
            const input = document.getElementById('userInput');
            input.value = conv.inputText || '';
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            
            // Restore attachment state (images + files)
            migrateLegacyImages(conv);
            renderPending();
            
            // Update send button state
            document.getElementById('sendBtn').disabled = conv.isLoading;
            
            renderMessages();
            renderConversationList();
            updateFeynmanUI();
            if (workspaceOpen) renderWorkspace();
            
            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('collapsed');
            }
        }

        function deleteConversation(id, event) {
            event.stopPropagation();
            if (!confirm('确定要删除这个对话吗？')) return;
            
            delete conversations[id];
            saveConversations();
            
            if (currentConvId === id) {
                const remaining = Object.keys(conversations);
                if (remaining.length > 0) {
                    switchToConversation(remaining[remaining.length - 1]);
                } else {
                    createNewChat();
                }
            }
            renderConversationList();
        }

        function getCurrentConversation() {
            return conversations[currentConvId];
        }

        function getMessages() {
            const conv = getCurrentConversation();
            return conv ? conv.messages : [{ role: 'system', content: SYSTEM_PROMPT }];
        }

        function updateConversationTitle() {
            const conv = getCurrentConversation();
            if (!conv || conv.title !== '新对话') return;
            
            const userMsgs = conv.messages.filter(m => m.role === 'user');
            if (userMsgs.length > 0) {
                const firstMsg = userMsgs[0];
                let text = '';
                if (firstMsg.displayText !== undefined) {
                    // 带文件附件的消息：优先用用户实际问题做标题
                    text = firstMsg.displayText || (firstMsg.attachedFiles || []).map(f => f.name).join('、') || '文件对话';
                } else if (Array.isArray(firstMsg.content)) {
                    const textPart = firstMsg.content.find(c => c.type === 'text');
                    text = textPart ? textPart.text : '图片对话';
                } else {
                    text = firstMsg.content;
                }
                conv.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                conv.updatedAt = Date.now();
                saveConversations();
                renderConversationList();
            }
        }

        // ===== Rendering =====

        function renderConversationList() {
            const list = document.getElementById('conversationList');
            const sorted = Object.values(conversations).sort((a, b) => b.updatedAt - a.updatedAt);
            
            if (sorted.length === 0) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:0.85rem;">暂无对话</div>';
                return;
            }
            
            list.innerHTML = sorted.map(conv => `
                <div class="conv-item ${conv.id === currentConvId ? 'active' : ''}" onclick="switchToConversation('${conv.id}')">
                    <div class="conv-info">
                        <div class="conv-title">${escapeHtml(conv.title)}${conv.isLoading ? ' <span style="color:#6366f1;font-size:0.7rem;">⏳</span>' : ''}</div>
                        <div class="conv-time">${formatTime(conv.updatedAt)}</div>
                    </div>
                    <button class="conv-delete" onclick="deleteConversation('${conv.id}', event)" title="删除">×</button>
                </div>
            `).join('');
        }

        function renderMessages() {
            const container = document.getElementById('chatContainer');
            const conv = getCurrentConversation();
            const msgs = getMessages().filter(m => m.role !== 'system');
            
            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">开始你的学习对话吧</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';

            // 费曼模式显示介绍卡片
            if (conv && (conv.mode === 'feynman' || conv.mode === 'feynman_done')) {
                container.innerHTML = `
                    <div class="feynman-intro">
                        <h3>🎓 费曼学习法</h3>
                        <p>用最简单的话把知识讲给别人听，是检验你是否真正掌握的最好方法。</p>
                        <p style="margin-top:8px;color:#78350f;"><strong>规则：</strong>你来当老师，我来当好奇的同学。我会不断追问，直到你能把问题讲得连"小白"都听懂为止。</p>
                    </div>
                `;
            }

            msgs.forEach(msg => {
                // 跳过费曼模式的内部评估指令
                if (msg.content === '[请给出最终评估]') return;
                if (Array.isArray(msg.content)) {
                    const text = msg.displayText !== undefined ? msg.displayText : (msg.content.find(c => c.type === 'text')?.text || '');
                    const images = msg.content.filter(c => c.type === 'image_url').map(c => c.image_url?.url);
                    addMessage(msg.role === 'user' ? 'user' : 'ai', text, images, false, [], msg.attachedFiles || []);
                } else {
                    const plainText = msg.displayText !== undefined ? msg.displayText : msg.content;
                    addMessage(msg.role === 'user' ? 'user' : 'ai', plainText, [], false, [], msg.attachedFiles || []);
                }
            });
            container.scrollTop = container.scrollHeight;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
            
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Sidebar Toggle =====

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // ===== Message Handling =====

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function handlePaste(e) {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    addPendingFiles([file]);
                    break;
                }
            }
        }

        // ===== 附件上传：点击直接打开资源管理器，发送时自动存入工作区 =====

        const TEXT_EXTS = ['txt','md','markdown','csv','json','log','py','c','cpp','cc','h','hpp','java','js','ts','jsx','tsx','html','css','xml','yml','yaml','sh','bat','vhd','vhdl','v','sv','ver','tex','bib','ini','cfg','conf','sql','r','m','pas','asm','s'];
        const MAX_TEXT_FILES = 5;          // 单条消息最多注入上下文的文本文件数
        const MAX_CHARS_PER_FILE = 8000;   // 单个文本文件注入上下文的最大字符数
        const MAX_PENDING_FILES = 20;      // 单条消息最多附加的文件数

        function isTextFile(file) {
            if (file.type && (file.type.startsWith('text/') || file.type === 'application/json' || file.type === 'application/xml')) return true;
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            return TEXT_EXTS.includes(ext);
        }

        function formatFileSize(size) {
            if (size < 1024) return size + 'B';
            if (size < 1024 * 1024) return (size / 1024).toFixed(1) + 'KB';
            return (size / 1024 / 1024).toFixed(1) + 'MB';
        }

        function handleAttachSelect(e) {
            const files = Array.from(e.target.files || []);
            e.target.value = '';
            addPendingFiles(files);
        }

        // 所有文件统一进入待发送附件列表，挂在输入框上方
        function addPendingFiles(files) {
            const conv = getCurrentConversation();
            if (!conv) { showToast('请先新建一个对话再上传文件'); return; }
            if (!conv.currentFiles) conv.currentFiles = [];
            let added = 0;
            for (const file of files) {
                if (conv.currentFiles.length >= MAX_PENDING_FILES) {
                    showToast('单条消息最多附加 ' + MAX_PENDING_FILES + ' 个文件');
                    break;
                }
                const entry = {
                    id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                    name: file.name || '粘贴图片.png',
                    size: file.size,
                    type: file.type || '',
                    dataUrl: null,
                    content: null
                };
                conv.currentFiles.push(entry);
                added++;
                const isImage = !!(file.type && file.type.startsWith('image/'));
                if (isImage && file.size <= 5 * 1024 * 1024) {
                    const r = new FileReader();
                    r.onload = ev => { entry.dataUrl = ev.target.result; saveConversations(); renderPending(); };
                    r.readAsDataURL(file);
                } else if (!isImage && isTextFile(file) && file.size <= 1024 * 1024) {
                    const r = new FileReader();
                    r.onload = ev => {
                        let content = String(ev.target.result || '');
                        if (content.length > MAX_CHARS_PER_FILE) {
                            content = content.slice(0, MAX_CHARS_PER_FILE) + '\n...(文件内容较长，已截断)';
                        }
                        entry.content = content;
                        saveConversations();
                        renderPending();
                    };
                    r.readAsText(file);
                } else if (!isImage && file.size <= 2 * 1024 * 1024) {
                    const r = new FileReader();
                    r.onload = ev => { entry.dataUrl = ev.target.result; saveConversations(); renderPending(); };
                    r.readAsDataURL(file);
                }
                // 超大文件只保留名称与大小，发送时以记录形式存入工作区
            }
            if (added > 0) {
                showToast('已添加 ' + added + ' 个附件，发送后自动存入工作区');
                saveConversations();
                renderPending();
            }
        }

        function renderPending() {
            const conv = getCurrentConversation();
            const imgBox = document.getElementById('imagePreview');
            const fileBox = document.getElementById('filePreview');
            if (!imgBox || !fileBox) return;
            const files = (conv && conv.currentFiles) || [];
            const images = files.filter(f => f.type && f.type.startsWith('image/'));
            const others = files.filter(f => !(f.type && f.type.startsWith('image/')));
            imgBox.innerHTML = images.map(f => `
                <div class="image-preview">
                    <img src="${f.dataUrl || ''}" alt="${escapeHtml(f.name)}">
                    <button class="remove-btn" onclick="removePending('${f.id}')">×</button>
                </div>
            `).join('');
            fileBox.innerHTML = others.map(f => `
                <div class="file-chip">
                    <span>📄</span>
                    <span class="file-chip-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
                    <span class="file-chip-size">${formatFileSize(f.size || 0)}</span>
                    <button class="remove-btn" onclick="removePending('${f.id}')">×</button>
                </div>
            `).join('');
        }

        function removePending(id) {
            const conv = getCurrentConversation();
            if (conv && conv.currentFiles) {
                conv.currentFiles = conv.currentFiles.filter(f => f.id !== id);
                saveConversations();
                renderPending();
            }
        }

        function clearPending(conv) {
            conv.currentFiles = [];
            conv.currentImages = [];
            renderPending();
        }

        // 兼容旧版本暂存的图片（currentImages 结构）
        function migrateLegacyImages(conv) {
            if (conv && conv.currentImages && conv.currentImages.length > 0) {
                if (!conv.currentFiles) conv.currentFiles = [];
                conv.currentImages.forEach((src, i) => {
                    conv.currentFiles.push({
                        id: 'legacy' + i + '_' + Date.now(),
                        name: '图片' + (i + 1) + '.png',
                        size: 0,
                        type: 'image/png',
                        dataUrl: src,
                        content: null
                    });
                });
                conv.currentImages = [];
            }
        }

        // 拖拽文件夹到输入框：递归读取目录内全部文件
        function setupInputDrop() {
            const zone = document.querySelector('.input-container');
            if (!zone || zone.dataset.dropBound) return;
            zone.dataset.dropBound = '1';
            zone.addEventListener('dragover', e => { e.preventDefault(); });
            zone.addEventListener('drop', e => {
                e.preventDefault();
                const entries = [];
                if (e.dataTransfer && e.dataTransfer.items) {
                    for (const it of e.dataTransfer.items) {
                        const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
                        if (en) entries.push(en);
                    }
                }
                if (entries.length > 0) {
                    walkEntries(entries, 0).then(files => { if (files.length) addPendingFiles(files); });
                } else if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                    addPendingFiles(Array.from(e.dataTransfer.files));
                }
            });
        }

        function walkEntries(entries, depth) {
            const tasks = entries.map(entry => new Promise(resolve => {
                if (entry.isFile) {
                    entry.file(f => resolve([f]), () => resolve([]));
                } else if (entry.isDirectory && depth < 4) {
                    const reader = entry.createReader();
                    const readAll = acc => new Promise(res => {
                        reader.readEntries(list => {
                            if (!list || list.length === 0) { res(acc); return; }
                            walkEntries(list, depth + 1).then(inner => readAll(acc.concat(inner)).then(res));
                        }, () => res(acc));
                    });
                    readAll([]).then(resolve);
                } else {
                    resolve([]);
                }
            }));
            return Promise.all(tasks).then(arrs => {
                let out = [];
                arrs.forEach(a => { out = out.concat(a); });
                return out.slice(0, 200);
            });
        }

        let toastTimer = null;
        function showToast(msg) {
            let el = document.getElementById('appToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'appToast';
                el.className = 'app-toast';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        function quickAsk(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            // Ensure we have a conversation
            if (!currentConvId || !conversations[currentConvId]) {
                createNewChat();
            }
            
            const conv = getCurrentConversation();
            migrateLegacyImages(conv);
            const pending = conv.currentFiles || [];
            const images = pending.filter(f => f.type && f.type.startsWith('image/') && f.dataUrl);
            const textFiles = pending.filter(f => f.content);
            
            if ((!text && pending.length === 0) || conv.isLoading) return;

            conv.isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            // Build message content（文本文件内容作为上下文注入）
            let sendText = text;
            if (textFiles.length > 0) {
                const fileContext = textFiles.map(f => '【附件文件：' + f.name + '】\n' + f.content).join('\n\n');
                sendText = fileContext + '\n\n' + (text ? '【我的问题】\n' + text : '请帮我分析讲解以上附件文件的内容。');
            }
            let content = [];
            images.forEach(img => {
                content.push({ type: 'image_url', image_url: { url: img.dataUrl } });
            });
            if (sendText) {
                content.push({ type: 'text', text: sendText });
            }

            // Display user message（气泡中只显示问题与附件标记）
            const attachedMeta = pending.map(f => ({ name: f.name, size: f.size }));
            addMessage('user', text, images.map(i => i.dataUrl), true, [], attachedMeta);
            
            // Save to conversation
            conv.messages.push({ role: 'user', content: content, displayText: text, attachedFiles: attachedMeta });
            conv.updatedAt = Date.now();
            saveConversations();
            updateConversationTitle();

            // Clear input
            input.value = '';
            input.style.height = 'auto';
            conv.inputText = '';
            
            // 附件随消息发送后自动存入工作区（从工作区引用的不重复保存）
            if (pending.length > 0) {
                const newFiles = pending.filter(f => !f.fromWorkspace);
                if (newFiles.length > 0) {
                    if (!conv.workspaceFiles) conv.workspaceFiles = [];
                    newFiles.forEach(f => {
                        let dataUrl = f.dataUrl;
                        if (!dataUrl && f.content) {
                            dataUrl = 'data:' + (f.type || 'text/plain') + ';charset=utf-8,' + encodeURIComponent(f.content);
                        }
                        conv.workspaceFiles.push({
                            id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                            name: f.name,
                            size: f.size,
                            type: f.type,
                            dataUrl: dataUrl || null,
                            addedAt: Date.now()
                        });
                    });
                    showToast(newFiles.length + ' 个附件已存入工作区');
                    if (workspaceOpen) renderWorkspace();
                }
            }
            clearPending(conv);
            saveConversations();

            const typingId = showTyping();
            let searchResults = [];

            try {
                // 如果联网搜索已开启且非费曼模式，先搜索再回答
                const isFeynmanMode = conv.mode === 'feynman' || conv.mode === 'feynman_done';
                if (webSearchEnabled && text && !isFeynmanMode) {
                    const searchStatusId = showSearchStatus('正在联网搜索：' + text);
                    
                    // 给搜索加全局超时（15秒）
                    try {
                        searchResults = await Promise.race([
                            performWebSearch(text),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('搜索超时')), 15000))
                        ]);
                    } catch (searchError) {
                        console.log('搜索超时或失败:', searchError);
                        searchResults = [];
                    }
                    removeSearchStatus(searchStatusId);
                    
                    if (searchResults.length > 0) {
                        const searchContext = formatSearchResultsForAI(searchResults, text);
                        const statusId2 = showSearchStatus(`已找到 ${searchResults.length} 条相关信息，正在整合分析...`);
                        
                        // 记录当前消息数量，方便之后清理临时上下文
                        const msgCountBeforeSearch = conv.messages.length;
                        
                        // 临时注入搜索上下文（仅用于本次API调用）
                        conv.messages.push({ role: 'user', content: '[联网搜索结果]\n' + searchContext });
                        conv.messages.push({ role: 'assistant', content: '好的，我已获取到搜索结果，正在整理答案...' });
                        // 再次加入用户原始消息，让AI基于上下文回答
                        conv.messages.push({ role: 'user', content: content });

                        const searchController = new AbortController();
                        const searchTimeoutId = setTimeout(() => searchController.abort(), 90000);
                        let streamIdleTimer = null;
                        const kickStreamIdle = () => {
                            clearTimeout(streamIdleTimer);
                            streamIdleTimer = setTimeout(() => searchController.abort(), 90000);
                        };

                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${API_KEY}`
                            },
                            body: JSON.stringify({
                                model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                                messages: conv.messages,
                                temperature: 0.7,
                                max_tokens: 2000,
                                stream: true
                            }),
                            signal: searchController.signal
                        });

                        clearTimeout(searchTimeoutId);
                        removeSearchStatus(statusId2);
                        removeTyping(typingId);

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.message || `API 错误：${response.status}`);
                        }

                        // 流式读取搜索结果回复
                        const bubble = createStreamingBubble();
                        let fullReply = '';
                        let streamAborted = false;
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let lastRender = 0;

                        try {
                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                kickStreamIdle();

                                buffer += decoder.decode(value, { stream: true });
                                const lines = buffer.split('\n');
                                buffer = lines.pop();

                                for (const line of lines) {
                                    const trimmed = line.trim();
                                    if (!trimmed || !trimmed.startsWith('data: ')) continue;
                                    const data = trimmed.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const json = JSON.parse(data);
                                        const delta = json.choices?.[0]?.delta?.content;
                                        if (delta) {
                                            fullReply += delta;
                                            const now = Date.now();
                                            if (now - lastRender > 100) {
                                                bubble.innerHTML = formatMessage(fullReply) + '<span class="streaming-cursor">▊</span>';
                                                const container = document.getElementById('chatContainer');
                                                container.scrollTop = container.scrollHeight;
                                                lastRender = now;
                                            }
                                        }
                                    } catch (e) { /* 忽略解析错误 */ }
                                }
                            }
                        } catch (streamErr) {
                            // 超时但已有部分内容：保留已生成部分
                            if (streamErr && streamErr.name === 'AbortError' && fullReply) {
                                streamAborted = true;
                            } else {
                                throw streamErr;
                            }
                        } finally {
                            clearTimeout(streamIdleTimer);
                        }

                        // 最终渲染
                        bubble.innerHTML = formatMessage(fullReply) + (streamAborted ? '<div class="stream-note">⏱️ 回复较长，已在此处中断。发送「继续」可以让我接着讲。</div>' : '');
                        // 添加搜索来源
                        let sourcesHtml = '<div class="search-sources"><details><summary>📋 信息来源（' + searchResults.length + ' 条）</summary>';
                        searchResults.forEach(r => {
                            sourcesHtml += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                        });
                        sourcesHtml += '</details></div>';
                        bubble.innerHTML += sourcesHtml;
                        attachMsgActions(bubble);
                        enhanceCodeBlocks(bubble);

                        const chatContainer = document.getElementById('chatContainer');
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        // 清理临时搜索上下文：截断到搜索前的消息数
                        conv.messages.length = msgCountBeforeSearch;
                        // 添加正式的AI回复
                        conv.messages.push({ role: 'assistant', content: fullReply });
                        conv.updatedAt = Date.now();
                        saveConversations();
                    } else {
                        // 搜索无结果，明确告知用户
                        const statusId2 = showSearchStatus('⚠️ 联网搜索未获取到结果，将基于AI自身知识回答（可能不准确）');
                        await new Promise(r => setTimeout(r, 1500));
                        removeSearchStatus(statusId2);
                        
                        // 添加警告消息到对话
                        conv.messages.push({ role: 'assistant', content: '⚠️ 联网搜索未能获取到相关信息（可能是网络问题或服务暂时不可用）。以下回答基于AI自身知识，可能不够准确或时效性不足，仅供参考。' });
                        await callAI(conv, content, typingId, []);
                    }
                } else {
                    // 未开启联网搜索，正常调用AI
                    await callAI(conv, content, typingId, []);
                }

            } catch (error) {
                removeTyping(typingId);
                if (error && error.name === 'AbortError') {
                    addMessage('ai', '⏱️ 请求超时了（网络较慢或服务器繁忙），请再发送一次试试。');
                } else {
                    addMessage('ai', `出错了：${error.message}。请检查网络连接或 API Key。`);
                }
            } finally {
                // 无论如何都要重置状态，防止按钮卡死
                conv.isLoading = false;
                saveConversations();
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        // 创建流式消息气泡（逐字显示）
        function createStreamingBubble() {
            const container = document.getElementById('chatContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = 'message ai';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble"><span class="streaming-cursor">▊</span></div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.querySelector('.bubble');
        }

        // 流式AI调用函数（逐字输出，带空闲超时保护）
        async function callAI(conv, content, typingId, searchResults) {
            const controller = new AbortController();
            // 空闲超时：90秒内没有任何新内容才中断；只要持续输出就不会被截断
            const IDLE_LIMIT = 90000;
            let idleTimer = setTimeout(() => controller.abort(), IDLE_LIMIT);
            const kickIdle = () => {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => controller.abort(), IDLE_LIMIT);
            };
            let bubble = null;
            let fullReply = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'Qwen/Qwen3-VL-30B-A3B-Instruct',
                        messages: conv.messages,
                        temperature: 0.7,
                        max_tokens: 2000,
                        stream: true
                    }),
                    signal: controller.signal
                });

                removeTyping(typingId);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `API 错误：${response.status}`);
                }

                // 流式读取响应
                bubble = createStreamingBubble();
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let lastRender = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    kickIdle();

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留未完成的行

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        const data = trimmed.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullReply += delta;
                                // 每100ms更新一次显示，避免过度渲染
                                const now = Date.now();
                                if (now - lastRender > 100) {
                                    bubble.innerHTML = formatMessage(fullReply) + '<span class="streaming-cursor">▊</span>';
                                    const container = document.getElementById('chatContainer');
                                    container.scrollTop = container.scrollHeight;
                                    lastRender = now;
                                }
                            }
                        } catch (e) { /* 忽略解析错误 */ }
                    }
                }

                // 最终渲染（去掉光标）
                bubble.innerHTML = formatMessage(fullReply);
                // 添加搜索来源
                if (searchResults && searchResults.length > 0) {
                    let sourcesHtml = '<div class="search-sources"><details><summary>📋 信息来源（' + searchResults.length + ' 条）</summary>';
                    searchResults.forEach(r => {
                        sourcesHtml += `<div class="search-source-item"><span class="source-tag">${escapeHtml(r.source)}</span>${escapeHtml(r.title)}</div>`;
                    });
                    sourcesHtml += '</details></div>';
                    bubble.innerHTML += sourcesHtml;
                }
                attachMsgActions(bubble);
                enhanceCodeBlocks(bubble);

                const container = document.getElementById('chatContainer');
                container.scrollTop = container.scrollHeight;

                conv.messages.push({ role: 'assistant', content: fullReply });
                conv.updatedAt = Date.now();
                saveConversations();
            } catch (err) {
                // 超时但已有部分内容：保留已生成的回复，而不是整条报错
                if (err && err.name === 'AbortError' && fullReply) {
                    if (bubble) {
                        bubble.innerHTML = formatMessage(fullReply) + '<div class="stream-note">⏱️ 回复较长，已在此处中断。发送「继续」可以让我接着讲。</div>';
                        attachMsgActions(bubble);
                        enhanceCodeBlocks(bubble);
                    }
                    conv.messages.push({ role: 'assistant', content: fullReply });
                    conv.updatedAt = Date.now();
                    saveConversations();
                    return;
                }
                throw err;
            } finally {
                clearTimeout(idleTimer);
            }
        }

        function addMessage(role, text, images, save = true, searchSources = [], attachedFiles = []) {
            const container = document.getElementById('chatContainer');
            
            // Remove empty state if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const div = document.createElement('div');

            const avatar = document.createElement('div');

                images.forEach(img => {

                attachedFiles.forEach(f => {
                    html += `<div class="msg-file-chip">📄 ${escapeHtml(f.name)}</div>`;
                });
            }
            if (text) {
                html += formatMessage(text);
            }
            // 添加搜索来源

                html += '<div class="search-sources">';

                searchSources.forEach(r => {

                });
                html += '</details></div>';

        // ===== 复制与引用 =====
        function copyToClipboard(text, okMsg) {
            const done = () => showToast(okMsg || '已复制到剪贴板');
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(); }
                catch (e) { showToast('复制失败，请手动选择复制'); }
                document.body.removeChild(ta);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(fallback);
            } else {
                fallback();
            }
        }

        // 取气泡的「显示文本」（排除操作按钮与代码复制按钮）
        function getBubbleText(bubble) {
            if (!bubble) return '';
            const hides = bubble.querySelectorAll('.msg-actions, .code-copy-btn');
            hides.forEach(n => { n.style.display = 'none'; });
            const t = bubble.innerText.trim();
            hides.forEach(n => { n.style.display = ''; });
            return t;
        }

        function copyMessageText(btn) {
            const bubble = btn.closest('.bubble');
            const t = getBubbleText(bubble);
            if (!t) { showToast('这条消息没有可复制的文字'); return; }
            copyToClipboard(t, '已复制该条消息');
        }

        function quoteMessage(btn) {
            const bubble = btn.closest('.bubble');
            quoteText(getBubbleText(bubble));
        }

        // 把引用内容插入输入框（每行加 > 前缀）
        function quoteText(text) {
            if (!text || !text.trim()) { showToast('没有可引用的文字'); return; }
            const ta = document.getElementById('userInput');
            const quoted = text.trim().split('\n').map(l => '> ' + l).join('\n');
            const cur = ta.value.replace(/\s+$/, '');
            ta.value = cur ? cur + '\n\n' + quoted + '\n\n' : quoted + '\n\n';
            ta.dispatchEvent(new Event('input'));
            ta.focus();
            const end = ta.value.length;
            ta.setSelectionRange(end, end);
            showToast('已引用到输入框，可继续补充你的问题');
        }

        // 给气泡加 复制/引用 操作栏（AI 回复额外加追问快捷动作）
        function attachMsgActions(bubble, isAI) {
            if (!bubble || bubble.querySelector('.msg-actions')) return;
            if (isAI === undefined) isAI = !!bubble.closest('.message.ai');
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            let html = '<button class="msg-action-btn" onclick="copyMessageText(this)">📋 复制</button>' +
                       '<button class="msg-action-btn" onclick="quoteMessage(this)">❝ 引用</button>';
            if (isAI) {
                html += '<button class="msg-action-btn" onclick="followUp(this,\'deeper\')">🔍 讲深一点</button>' +
                        '<button class="msg-action-btn" onclick="followUp(this,\'simpler\')">💡 讲简单点</button>' +
                        '<button class="msg-action-btn" onclick="followUp(this,\'example\')">🌰 举个例子</button>' +
                        '<button class="msg-action-btn" onclick="followUp(this,\'quizme\')">✍️ 考考我</button>';
            }
            actions.innerHTML = html;
            bubble.appendChild(actions);
        }

        // 一键追问：把回复片段按意图包装后直接发送
        function followUp(btn, kind) {
            const bubble = btn.closest('.bubble');
            let snippet = getBubbleText(bubble);
            if (!snippet) return;
            if (snippet.length > 800) snippet = snippet.slice(0, 800) + '…';
            const quoted = snippet.split('\n').map(l => '> ' + l).join('\n');
            const tpl = {
                deeper: '请把下面这段内容讲得更深入一些，补充原理和推导过程：\n',
                simpler: '请用更通俗、更简单的语言重新讲一遍下面这段内容，像给零基础的同学讲：\n',
                example: '请给下面这段内容举一个具体生动的例子或类比，帮我理解：\n',
                quizme: '请基于下面这段内容出一道题考考我（先只出题，不要给答案，等我回答）：\n'
            }[kind];
            sendRawQuestion(tpl + quoted);
        }

        // 代码块右下角加一键复制按钮
        function enhanceCodeBlocks(root) {
            if (!root) return;
            root.querySelectorAll('pre').forEach(pre => {
                if (pre.parentElement && pre.parentElement.classList.contains('code-wrap')) return;
                const wrap = document.createElement('div');
                wrap.className = 'code-wrap';
                pre.parentNode.insertBefore(wrap, pre);
                wrap.appendChild(pre);
                const btn = document.createElement('button');
                btn.className = 'code-copy-btn';
                btn.textContent = '复制';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    copyToClipboard(pre.innerText.replace(/\s+$/, ''), '代码已复制');
                    btn.textContent = '已复制';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
                };
                wrap.appendChild(btn);
            });
        }

        // ===== 选中文字浮动引用按钮 =====
        let selQuoteText = '';
        function hideQuoteFloat() {
            const btn = document.getElementById('quoteFloat');
            if (btn) btn.classList.remove('show');
            selQuoteText = '';
        }
        function updateQuoteFloat() {
            const btn = document.getElementById('quoteFloat');
            if (!btn) return;
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideQuoteFloat(); return; }
            const text = sel.toString().trim();
            if (!text) { hideQuoteFloat(); return; }
            const node = sel.getRangeAt(0).commonAncestorContainer;
            const el = node.nodeType === 1 ? node : node.parentElement;
            if (!el || !el.closest || !el.closest('.bubble')) { hideQuoteFloat(); return; }
            const rect = sel.getRangeAt(0).getBoundingClientRect();
            if (!rect || (rect.width === 0 && rect.height === 0)) { hideQuoteFloat(); return; }
            selQuoteText = text;
            const btnW = 92;
            let left = rect.left + rect.width / 2 - btnW / 2;
            left = Math.max(8, Math.min(left, window.innerWidth - btnW - 8));
            let top = rect.top - 40;
            if (top < 8) top = rect.bottom + 8;
            btn.style.left = left + 'px';
            btn.style.top = top + 'px';
            btn.classList.add('show');
        }
        function quoteSelection() {
            const t = selQuoteText;
            hideQuoteFloat();
            const sel = window.getSelection();
            if (sel) sel.removeAllRanges();
            if (t) quoteText(t);
        }
        function setupQuoteFloat() {
            document.addEventListener('mouseup', () => setTimeout(updateQuoteFloat, 10));
            document.addEventListener('touchend', () => setTimeout(updateQuoteFloat, 10));
            const chat = document.getElementById('chatContainer');
            if (chat) chat.addEventListener('scroll', hideQuoteFloat);
        }

        function formatMessage(text) {
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/^\* (.+)$/gm, '<li>$1</li>');
            text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
            text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            text = text.replace(/\n\n/g, '</p><p>');
            text = '<p>' + text + '</p>';
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/<p><\/p>/g, '');
            text = text.replace(/<p>(<h3>)/g, '$1');
            text = text.replace(/(<\/h3>)<\/p>/g, '$1');
            text = text.replace(/<p>(<ul>)/g, '$1');
            text = text.replace(/(<\/ul>)<\/p>/g, '$1');
            text = text.replace(/<p>(<pre>)/g, '$1');
            text = text.replace(/(<\/pre>)<\/p>/g, '$1');
            return text;
        }

        // ===== 工作区面板 =====

        let workspaceOpen = false;

        function toggleWorkspace() {
            workspaceOpen = !workspaceOpen;
            const panel = document.getElementById('workspacePanel');
            const toggle = document.getElementById('workspaceToggle');
            panel.classList.toggle('collapsed', !workspaceOpen);
            toggle.classList.toggle('active', workspaceOpen);

        function getWorkspaceFiles() {
            const conv = getCurrentConversation();
            if (!conv) return [];
            if (!conv.workspaceFiles) conv.workspaceFiles = [];
            return conv.workspaceFiles;
        }

        function clearWorkspace() {
            const conv = getCurrentConversation();
            if (!conv) { showToast('请先选择或新建一个对话'); return; }
            if (!conv.workspaceFiles || conv.workspaceFiles.length === 0) {
                showToast('工作区已经是空的');
                return;
            }
            if (!confirm('确定清空当前对话工作区的所有文件吗？此操作不可恢复。')) return;
            conv.workspaceFiles = [];
            saveConversations();
            renderWorkspace();
            showToast('工作区已清空');
        }

        // 将文件存入当前对话工作区；metaOnly=true 时只存元信息不存内容
        function pushWorkspaceFile(file, metaOnly) {
            const conv = getCurrentConversation();
            if (!conv) return;
            if (!conv.workspaceFiles) conv.workspaceFiles = [];
            const genId = () => Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const canStore = !metaOnly && ((file.type && file.type.startsWith('image/') && file.size < 5 * 1024 * 1024) || file.size < 2 * 1024 * 1024);
            if (canStore) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    conv.workspaceFiles.push({
                        id: genId(),
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        dataUrl: e.target.result,
                        addedAt: Date.now()
                    });
                    saveConversations();
                    renderWorkspace();
                };
                reader.readAsDataURL(file);
            } else {
                // 大文件只存信息不存内容
                conv.workspaceFiles.push({
                    id: genId(),
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    dataUrl: null,
                    addedAt: Date.now()
                });
                saveConversations();
                renderWorkspace();
            }
        }

        function removeWorkspaceItem(id) {
            const conv = getCurrentConversation();
            if (!conv || !conv.workspaceFiles) return;
            conv.workspaceFiles = conv.workspaceFiles.filter(f => f.id !== id);
            saveConversations();
            renderWorkspace();

        function renderWorkspace() {
            const container = document.getElementById('workspaceItems');
            const files = getWorkspaceFiles();

            if (files.length === 0) {
                container.innerHTML = '<div class="workspace-empty"><div class="empty-icon">📁</div>还没有文件<br>对话中发送的附件会自动存入这里<br>点击文件可附加到对话</div>';
                return;
            }

            const images = files.filter(f => f.type && f.type.startsWith('image/'));
            const others = files.filter(f => !f.type || !f.type.startsWith('image/'));

            let html = '';

            if (images.length > 0) {
                html += '<div class="workspace-section-title">图片 (' + images.length + ')·点击附加到对话</div>';
                html += '<div class="workspace-grid">';
                images.forEach(img => {
                    html += `<div class="workspace-item" onclick="attachWorkspaceItem('${img.id}')">
                        <img src="${img.dataUrl || ''}" alt="${escapeHtml(img.name)}">
                        <div class="item-name">${escapeHtml(img.name)}</div>
                        <button class="item-zoom" onclick="event.stopPropagation();openLightbox('${img.dataUrl || ''}')">🔍</button>
                        <button class="item-remove" onclick="event.stopPropagation();removeWorkspaceItem('${img.id}')">×</button>
                    </div>`;
                });
                html += '</div>';
            }

            if (others.length > 0) {
                html += '<div class="workspace-section-title">文件 (' + others.length + ')·点击附加到对话</div>';
                others.forEach(file => {
                    const icon = getFileIcon(file.type, file.name);
                    const size = formatFileSize(file.size);
                    html += `<div class="workspace-file-item" onclick="attachWorkspaceItem('${file.id}')">
                        <span class="file-icon">${icon}</span>
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            <div class="file-size">${size}</div>
                        </div>
                        <button class="file-remove" onclick="event.stopPropagation();removeWorkspaceItem('${file.id}')">×</button>
                    </div>`;
                });
            }

            container.innerHTML = html;
        }

        // 点击工作区文件：作为附件加入输入框（与上传附件同样的小标签）
        function attachWorkspaceItem(id) {
            const conv = getCurrentConversation();
            if (!conv || !conv.workspaceFiles) return;
            const item = conv.workspaceFiles.find(f => f.id === id);
            if (!item) return;
            if (!conv.currentFiles) conv.currentFiles = [];
            if (conv.currentFiles.some(f => f.fromWorkspace === id)) {
                showToast('该文件已在输入框附件中');
                return;
            }
            if (conv.currentFiles.length >= MAX_PENDING_FILES) {
                showToast('单条消息最多附加 ' + MAX_PENDING_FILES + ' 个文件');
                return;
            }
            if (!item.dataUrl) {
                showToast('该文件只保存了名称（文件过大），没有内容可附加');
                return;
            }
            const entry = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                name: item.name,
                size: item.size,
                type: item.type || '',
                dataUrl: item.dataUrl,
                content: null,
                fromWorkspace: id
            };
            const isImage = !!(item.type && item.type.startsWith('image/'));
            if (!isImage && isTextFile({ name: item.name, type: item.type })) {
                // 文本类文件解码出内容，发送时交给 AI 阅读
                const text = decodeDataUrlText(item.dataUrl);
                if (text !== null) {
                    entry.content = text.length > MAX_CHARS_PER_FILE
                        ? text.slice(0, MAX_CHARS_PER_FILE) + '\n...(文件内容较长，已截断)'
                        : text;
                    entry.dataUrl = null;
                }
            }
            conv.currentFiles.push(entry);
            saveConversations();
            renderPending();
            showToast('已附加「' + item.name + '」到输入框');
        }

        function decodeDataUrlText(dataUrl) {
            try {
                const comma = dataUrl.indexOf(',');
                if (comma < 0) return null;
                const meta = dataUrl.slice(0, comma);
                const rest = dataUrl.slice(comma + 1);
                if (meta.includes(';base64')) {
                    const bin = atob(rest);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    return new TextDecoder('utf-8').decode(bytes);
                }
                return decodeURIComponent(rest);
            } catch (e) {
                return null;
            }
        }

        function getFileIcon(type, name) {
            if (!type) type = '';
            if (type.includes('pdf') || name.endsWith('.pdf')) return '📕';
            if (type.includes('word') || name.match(/\.docx?$/)) return '📘';
            if (type.includes('excel') || name.match(/\.xlsx?$/)) return '📗';
            if (type.includes('powerpoint') || name.match(/\.pptx?$/)) return '📙';
            if (type.includes('text') || name.match(/\.(txt|md)$/)) return '📄';
            if (type.includes('zip') || type.includes('rar')) return '📦';
            return '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function shareConversation() {
            const conv = getCurrentConversation();
            if (!conv) return;
            
            const chatMessages = conv.messages.filter(m => m.role !== 'system');
            if (chatMessages.length === 0) {
                alert('还没有对话内容，先聊点什么再分享吧');
                return;
            }

            // 精简消息结构，减少数据量
            const slim = chatMessages.map(m => {
                if (typeof m.content === 'string') return { r: m.role[0], c: m.content };
                // 多模态消息（含图片）只保留文本部分
                const textParts = m.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
                const item = { r: m.role[0], c: textParts || '' };
                if (m.displayText !== undefined) item.d = m.displayText;
                if (m.attachedFiles && m.attachedFiles.length > 0) item.f = m.attachedFiles.map(f => f.name);
                return item;
            });

            const json = JSON.stringify(slim);
            // 使用 LZ-String 压缩（比纯 base64 短 50-70%）
            const encoded = (typeof LZString !== 'undefined')
                ? LZString.compressToEncodedURIComponent(json)
                : btoa(unescape(encodeURIComponent(json)));
            const url = window.location.origin + window.location.pathname + '#share=' + encoded;

            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.header-btn');
                const original = btn.textContent;
                btn.textContent = '已复制!';
                btn.style.background = '#dcfce7';
                btn.style.color = '#16a34a';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(() => {
                prompt('复制以下链接分享：', url);
            });
        }

        function loadSharedConversation() {
            const hash = window.location.hash;
            if (!hash.startsWith('#share=')) return false;

            const encoded = hash.substring(7);
            try {
                let json;
                // 尝试 LZ-String 解压（新格式）
                if (typeof LZString !== 'undefined') {
                    json = LZString.decompressFromEncodedURIComponent(encoded);
                }
                // 回退到 base64（旧格式兼容）
                if (!json) {
                    json = decodeURIComponent(escape(atob(encoded)));
                }

                const data = JSON.parse(json);
                if (!Array.isArray(data) || data.length === 0) return false;

                // 支持新精简格式 {r:'u',c:'...'} 和旧完整格式 {role:'user',content:'...'}
                const chatMessages = data.map(m => {
                    if (m.r) {
                        const roleMap = { u: 'user', a: 'assistant', s: 'system' };
                        const msg = { role: roleMap[m.r] || m.r, content: m.c };
                        if (m.d !== undefined) msg.displayText = m.d;
                        if (m.f && m.f.length > 0) msg.attachedFiles = m.f.map(name => ({ name: name }));
                        return msg;
                    }
                    return m;
                });

                // Create a new conversation for the shared content
                const id = generateId();
                conversations[id] = createConversationData(id, '分享的对话');
                conversations[id].messages = [{ role: 'system', content: SYSTEM_PROMPT }, ...chatMessages];
                saveConversations();
                switchToConversation(id);
                renderConversationList();
                
                // Add notice
                const container = document.getElementById('chatContainer');
                const notice = document.createElement('div');
                notice.style.cssText = 'text-align:center;padding:8px;color:#6b7280;font-size:0.85rem;';
                notice.textContent = '— 以上是分享的对话内容，你可以继续提问 —';
                container.appendChild(notice);
                container.scrollTop = container.scrollHeight;

                return true;
            } catch (e) {
                console.error('加载分享对话失败:', e);
                return false;
            }
        }
